<script>var OFFLINE_TPL = "<!DOCTYPE html>\n<html lang=\"zh-CN\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>__TITLE__<\/title>\n<style>\n  :root{\n    --bg:#eef1f5;\n    --card:#ffffff;\n    --ink:#1b2430;\n    --ink-2:#3d4855;\n    --muted:#7a8695;\n    --line:#d9dfe7;\n    --line-soft:#e9edf2;\n    --p1:#2563eb;\n    --p2:#d97706;\n    --ok:#0f766e;\n    --shadow:0 1px 2px rgba(20,30,45,.06), 0 10px 28px rgba(20,30,45,.07);\n  }\n  *{box-sizing:border-box}\n  html,body{margin:0;padding:0}\n  body{\n    background:var(--bg);\n    color:var(--ink);\n    font-family:-apple-system,BlinkMacSystemFont,\"PingFang SC\",\"Hiragino Sans GB\",\"Microsoft YaHei\",Arial,sans-serif;\n    -webkit-font-smoothing:antialiased;\n    padding:18px 20px 40px;\n  }\n  .wrap{max-width:1340px;margin:0 auto}\n\n  /* ---------- 页头 ---------- */\n  header.page{\n    display:flex;align-items:flex-end;justify-content:space-between;\n    gap:16px;flex-wrap:wrap;margin-bottom:14px;padding:0 2px;\n  }\n  h1{font-size:20px;line-height:1.25;margin:0 0 6px;letter-spacing:.01em}\n  .meta{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap}\n  .meta b{color:var(--ink-2);font-weight:600}\n  .sep{color:var(--line)}\n  .badge{\n    display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;\n    color:var(--ok);background:#e6f4f1;border:1px solid #c4e4de;border-radius:999px;padding:3px 9px;\n  }\n  .badge i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}\n\n  /* ---------- 卡片 ---------- */\n  .card{\n    background:var(--card);border:1px solid var(--line);border-radius:14px;\n    box-shadow:var(--shadow);padding:14px 16px;margin-bottom:12px;\n  }\n  .row{display:flex;align-items:center;gap:13px;flex-wrap:wrap}\n  .row + .row{margin-top:11px;padding-top:11px;border-top:1px dashed var(--line-soft)}\n  .field{display:flex;align-items:center;gap:7px}\n  .field > .lbl{font-size:12.5px;color:var(--muted);font-weight:600;letter-spacing:.02em;white-space:nowrap}\n\n  .play{\n    display:inline-flex;align-items:center;justify-content:center;gap:9px;\n    width:116px;height:44px;padding:0;border:0;border-radius:11px;cursor:pointer;\n    background:var(--ink);color:#fff;font-size:15px;font-weight:650;letter-spacing:.03em;\n    font-family:inherit;transition:transform .1s, box-shadow .15s, background .15s;\n    box-shadow:0 6px 16px rgba(27,36,48,.22);\n  }\n  .play:hover{transform:translateY(-1px);box-shadow:0 9px 20px rgba(27,36,48,.26)}\n  .play:active{transform:translateY(0)}\n  .play.on{background:#b91c1c;box-shadow:0 6px 16px rgba(185,28,28,.26)}\n  /* 图标用 CSS 画，不依赖字体里的 ▶ / ❚❚ 字形。\n     类名必须与按钮的 .play 区分，否则会继承按钮的 padding 把宽度撑开 */\n  .ico{position:relative;width:12px;height:13px;flex:0 0 auto}\n  .ico.i-play::before{\n    content:\"\";position:absolute;left:1px;top:0;width:0;height:0;\n    border-style:solid;border-width:6.5px 0 6.5px 11px;\n    border-color:transparent transparent transparent currentColor;\n  }\n  .ico.i-pause::before,.ico.i-pause::after{\n    content:\"\";position:absolute;top:0;width:3.5px;height:13px;border-radius:1px;background:currentColor;\n  }\n  .ico.i-pause::before{left:1px}\n  .ico.i-pause::after{right:1px}\n  .btn{\n    height:33px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:#fff;\n    color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;\n    transition:background .13s,border-color .13s,opacity .13s;\n  }\n  .btn:hover{background:#f4f7fb;border-color:#c3cddb}\n  .btn:disabled{opacity:.4;cursor:not-allowed}\n  .btn.mini{height:29px;padding:0 10px;font-size:12px}\n  .btn.lg{height:44px;padding:0 16px;font-size:14px;border-radius:11px;display:inline-flex;align-items:center;gap:7px}\n  .btn.lg .rt{font-size:16px;line-height:1;transform:translateY(-1px)}\n\n  .chk{\n    display:inline-flex;align-items:center;gap:7px;height:33px;padding:0 12px 0 10px;\n    border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;\n    font-size:13.5px;font-weight:600;user-select:none;transition:background .13s,border-color .13s,color .13s;\n  }\n  .chk input{appearance:none;-webkit-appearance:none;width:15px;height:15px;margin:0;border-radius:4px;border:1.5px solid #b7c2d0;background:#fff;position:relative;cursor:pointer;transition:background .13s,border-color .13s}\n  .chk input:checked{background:var(--c);border-color:var(--c)}\n  .chk input:checked::after{content:\"\";position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}\n  .chk.c1{--c:var(--p1)}\n  .chk.c2{--c:var(--p2)}\n  .chk.c1:has(input:checked){background:#f2f6ff;border-color:#cdddff;color:var(--p1)}\n  .chk.c2:has(input:checked){background:#fff7ec;border-color:#f4dcbb;color:#b45309}\n\n  input[type=range]{\n    -webkit-appearance:none;appearance:none;height:4px;border-radius:2px;background:var(--line);\n    outline:none;cursor:pointer;\n  }\n  input[type=range]::-webkit-slider-thumb{\n    -webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#fff;\n    border:2px solid var(--c,var(--ink-2));box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;\n  }\n  input[type=range]:disabled{opacity:.35;cursor:not-allowed}\n  input[type=range]:disabled::-webkit-slider-thumb{cursor:not-allowed}\n  .vol{width:96px}\n  .bpm{width:180px}\n  .v1{--c:var(--p1)} .v2{--c:var(--p2)} .vg{--c:var(--ink-2)}\n  .num{\n    font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;\n    min-width:46px;text-align:right;\n  }\n\n  /* ---------- 预备 / 状态 ---------- */\n  .stage{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding:11px 2px 0}\n  .prep{display:flex;align-items:center;gap:8px}\n  .prep .cap{font-size:12.5px;font-weight:650;color:var(--muted);letter-spacing:.06em}\n  .pcell{\n    width:36px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:#fafbfd;\n    display:flex;align-items:center;justify-content:center;\n    font-size:15px;font-weight:700;color:#aab4c2;font-variant-numeric:tabular-nums;\n    transition:all .09s ease;\n  }\n  .pcell.strong{border-color:#c9d2de}\n  .prep.off .pcell{opacity:.35}\n  .pcell.on{background:#0f172a;border-color:#0f172a;color:#fff;transform:translateY(-2px) scale(1.07);box-shadow:0 6px 14px rgba(27,36,48,.25)}\n  .readout{font-size:13.5px;font-weight:650;color:var(--ink-2);min-width:200px;font-variant-numeric:tabular-nums}\n  .readout b{color:var(--ink);font-size:15px}\n  .readout small{color:var(--muted);font-weight:500;font-size:12px}\n  .pulse{display:flex;align-items:center;gap:9px}\n  .pulse .dot{width:12px;height:12px;border-radius:50%;background:#e3e8ef;transition:all .1s}\n  .pulse .dot.s{width:15px;height:15px}\n  .pulse .dot.on{background:#0f172a;transform:scale(1.18);box-shadow:0 0 0 4px rgba(15,23,42,.1)}\n  .pulse .dot.w.on{background:#76818f;box-shadow:0 0 0 4px rgba(118,129,143,.12)}\n\n  /* ---------- 乐谱 ---------- */\n  .scorehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px;flex-wrap:wrap}\n  .scorehead .t{font-size:13.5px;font-weight:700;letter-spacing:.02em}\n  .scorehead .t span{color:var(--muted);font-weight:600;font-size:12px;margin-left:9px}\n  .jkey{display:inline-flex;align-items:center;gap:9px;font-size:12px;color:var(--muted);font-weight:600}\n  .jkey b{font-size:15px;color:var(--ink);font-weight:800;letter-spacing:.03em;font-family:Georgia,\"Times New Roman\",serif}\n  .scorewrap{overflow-x:auto;padding:2px 0 2px}\n  .score{min-width:980px}\n\n  .system + .system{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line-soft)}\n  .grid{\n    display:grid;\n    grid-template-columns:64px repeat(8, minmax(0,1fr));\n    align-items:center;\n  }\n  .mnum{text-align:center;font-size:10px;color:#b8c1cd;font-weight:600;padding-bottom:2px;font-variant-numeric:tabular-nums;letter-spacing:.04em}\n  .lab{\n    font-size:12px;font-weight:700;letter-spacing:.03em;padding-right:8px;\n    display:flex;align-items:center;gap:5px;white-space:nowrap;\n  }\n  .lab::before{content:\"\";width:3px;height:14px;border-radius:2px;background:currentColor;opacity:.85}\n  .lab.p1{color:var(--p1)} .lab.p2{color:var(--p2)}\n\n  /* 每个小节格带上声部色，音符与外框通过继承取到 --acc */\n  .meas.p1{--acc:var(--p1)}\n  .meas.p2{--acc:var(--p2)}\n\n  /* 小节内按\"第几拍\"占位，不居中。\n     每个音的宽度按它自己的时值分（flex-grow 由 buildNote 写在元素上），\n     音符靠左放在自己那一拍上；每拍因此等宽，第几拍就出现在第几拍的位置。\n     原来这里是 justify-content:space-evenly —— 那会把只有一个音的小节摆到正中，\n     看起来像\"这一小节只有半拍\"。（用户 2026-09-28 指出） */\n  .meas{\n    border-left:1px solid var(--line);\n    min-height:58px;height:100%;\n    display:flex;align-items:center;justify-content:flex-start;gap:2px;\n    padding:0 3px;\n  }\n  /* 直接子项就是\"拍位槽\"：基准宽 0，多出来的空档按 flex-grow（= 时值）分，\n     所以有富余时槽位严格按时值成比例 —— 每拍等宽，第几拍就在第几拍上。\n     flex-shrink:0 是怕被压缩；min-width 保持默认的 auto（= 内容宽），\n     这样音符密到槽位装不下时会以内容宽兜底（宁可这一小节挤一点，也不让音符重叠）。 */\n  .meas > *{flex-shrink:0;flex-basis:0}\n  .meas.last{border-right:1.5px solid #b9c3cf}\n  .system:last-of-type .meas.last{border-right:3px double #8f9aa8}\n\n  .ng{\n    position:relative;display:inline-flex;align-items:center;\n    padding:6px 6px;border-radius:10px;color:var(--acc);cursor:pointer;\n    transition:background .08s ease, color .08s ease, transform .08s ease, box-shadow .08s ease;\n  }\n  /* 悬停：声部色描边 + 微抬，作为「可点击/从此处播放」的提示；\n     与「正在播放」的实心色块区分开。规则写在 .ng.on 之前，播放态优先 */\n  .ng:hover{\n    background:rgba(27,36,48,.07);\n    box-shadow:0 0 0 2px var(--acc), 0 5px 14px rgba(20,30,45,.14);\n    transform:translateY(-2px);\n  }\n  /* 「从此处播放」气泡：定位在 body 层，避免被乐谱的横向滚动容器裁掉 */\n  .tip{\n    position:fixed;left:0;top:0;z-index:60;pointer-events:none;\n    background:#1b2430;color:#fff;font-size:11px;font-weight:600;letter-spacing:.02em;\n    padding:4px 8px;border-radius:6px;white-space:nowrap;\n    box-shadow:0 4px 12px rgba(20,30,45,.22);\n    opacity:0;transform:translate(-50%,-100%);transition:opacity .12s ease;\n  }\n  .tip.on{opacity:1}\n  .ng .d{\n    display:inline-flex;align-items:center;position:relative;line-height:1;\n    font-size:clamp(18px,1.75vw,25px);font-weight:680;\n    font-variant-numeric:tabular-nums;letter-spacing:.01em;\n  }\n  .ng .dn{position:relative;display:inline-block}\n  .ng .oct{\n    position:absolute;left:50%;top:-9.5px;transform:translateX(-50%);\n    width:4.5px;height:4.5px;border-radius:50%;background:currentColor;\n  }\n  .ng .aug{width:4.5px;height:4.5px;border-radius:50%;background:currentColor;margin-left:4px;flex:0 0 auto}\n  .ng .dash{font-size:clamp(16px,1.6vw,23px);font-weight:600;line-height:1;opacity:.7;letter-spacing:1px;margin-left:3px}\n  /* 八分音符：下划线。连续八分音符用 .beam 包住，使下划线连成一条横梁 */\n  /* 一条横梁 = 拍内的短音符。左右留 4px：横梁是按\"拍\"分组的，两组之间必须能看出断开，\n     否则前后两组会贴成一条长线，分组就白做了（组内不受影响——线画在音符盒子上、盒子相邻就接上） */\n  .beam{display:inline-flex;align-items:center;gap:0;margin:0 4px}\n  /* 横梁线：**两端不要圆角**。\n     线是逐音符画在音符盒子上的（盒子相邻→接上），带圆角时每个接缝处会露出一个\"关节\"，\n     放大看像自己随手画的。方头对接就是一条连续的直线。（用户 2026-09-29 指出） */\n  .ng.e8::after{\n    content:\"\";position:absolute;left:0;right:0;bottom:2px;height:1.8px;\n    background:currentColor;\n  }\n  .ng.on{background:var(--acc);color:#fff;transform:translateY(-2px);box-shadow:0 6px 16px rgba(20,30,45,.24)}\n  .ng.on .dash{opacity:.95}\n\n  /* ---------- 底部 ---------- */\n  .foot{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);padding:0 4px;line-height:1.7}\n  kbd{\n    display:inline-block;min-width:18px;text-align:center;padding:1px 5px;margin:0 2px;\n    border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:#fff;\n    font-family:inherit;font-size:11px;font-weight:600;color:var(--ink-2);\n  }\n  .note-warn{color:#b45309}\n\n  @media (max-width:900px){\n    body{padding:12px 10px 30px}\n    .readout{min-width:auto}\n  }\n\n  /* ---------- 全屏（投屏）模式：只留谱子 ---------- */\n  /* 右上角退出按钮：默认隐形，鼠标一动就亮，停 2.6 秒自己退回去 */\n  .fsbar{\n    position:fixed;right:20px;top:20px;z-index:80;\n    opacity:0;transform:translateY(-8px);pointer-events:none;\n    transition:opacity .18s ease, transform .18s ease;\n  }\n  body.fs .fsbar.on{opacity:1;transform:none;pointer-events:auto}\n  .fsquit{\n    display:inline-flex;align-items:center;gap:10px;height:48px;padding:0 20px;\n    border:0;border-radius:13px;cursor:pointer;background:#0f172a;color:#fff;\n    font-family:inherit;font-size:15.5px;font-weight:650;letter-spacing:.04em;\n    box-shadow:0 12px 30px rgba(15,23,42,.32);\n  }\n  .fsquit:hover{background:#1b2430}\n  .fsquit:active{transform:translateY(1px)}\n  .fsquit svg{display:block}\n\n  body.fs{padding:0;background:#fff;overflow:hidden}\n  body.fs header.page,\n  body.fs .card.tools,\n  body.fs .scorehead,\n  body.fs .stage,\n  body.fs .foot{display:none!important}\n  /* 谱面卡片直接铺满视口，其余一律不出现 */\n  body.fs #scorecard{\n    position:fixed;inset:0;z-index:1;display:flex;align-items:center;justify-content:center;\n    border:0;border-radius:0;box-shadow:none;margin:0;padding:0;background:#fff;\n  }\n  body.fs .scorewrap{overflow:visible;padding:0;flex:0 0 auto}\n  body.fs .score{min-width:0;transform-origin:center center}\n  /* 投屏是给后排看的，行距和间距都放开一点，放大后更松快。\n     行高由 --fs-row 控制：JS 会算出「让谱面正好填满屏幕」需要的行高再写进来 */\n  body.fs .system + .system{margin-top:44px;padding-top:34px}\n  body.fs .meas{min-height:var(--fs-row,86px)}\n  body.fs .ng .d{font-size:25px}\n  body.fs .ng .dash{font-size:23px}\n  body.fs .mnum{font-size:12px;padding-bottom:4px}\n  body.fs .lab{font-size:14px}\n\n  @media print{\n    body{background:#fff;padding:0}\n    .card.tools,.foot,.badge,.stage{display:none!important}\n    .card{box-shadow:none;border:0;padding:0}\n    .ng{color:#000!important}\n    .lab.p1,.lab.p2{color:#000}\n    .score{min-width:0}\n  }\n  /* ===== 导出页补充（由 make_offline_template.py 追加）=====\n     原版只有上八度点、单下划线。生成器会产出低八度音（占 26%）与十六分音符，\n     这两处不补的话，低音会画成不带点的音、十六分会画成和八分一样。 */\n  .ng .oct.low{top:auto;bottom:-9.5px}\n  /* 同 .ng.e8::after：方头，不要圆角——否则十六分那两根线的每一段都带关节 */\n  .ng.e16::after{\n    content:\"\";position:absolute;left:0;right:0;bottom:2px;height:1.8px;\n    background:currentColor;\n  }\n  .ng.e16::before{\n    content:\"\";position:absolute;left:0;right:0;bottom:-1.6px;height:1.8px;\n    background:currentColor;\n  }\n  body.fs .ng.e16::after{bottom:3px}\n  body.fs .ng.e16::before{bottom:-0.6px}\n<\/style>\n<!--\n【音频与出处】\nFluidR3 SoundFont — Copyright (c) 2000-2002, 2008 Frank Wen <getfrank@gmail.com>\n（原作者的分发说明标注为 MIT 许可）\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the \"Software\"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in\nall copies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED \"AS IS\", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN\nTHE SOFTWARE.\n\n预渲染 MP3 采样来自 gleitz/midi-js-soundfonts\n（该仓库 README 将 Fluid Soundfont 标注为 CC BY 3.0；其 LICENSE.txt 的 MIT\n仅覆盖打包代码，© 2012 Benjamin Gleitzman）。\n本产品选取其中 20 个音（MIDI 57–76），音频数据未做任何修改（md5 与上游一致）；\n仅在播放时按 samples/manifest.json 里的增益做电平归一，文件本身未改。\n取样的具体地址记在仓库里（samples/manifest.json 的 source.base_url），\n不写进产物——产物理面只该有许可链接，不该出现\"看起来像\"数据来源的网址。\n许可链接：\n  MIT          https://opensource.org/license/mit\n  CC BY 3.0 US https://creativecommons.org/licenses/by/3.0/us/\n-->\n<\/head>\n<body>\n<div class=\"wrap\">\n\n  <header class=\"page\">\n    <div>\n      <h1>__H1__<\/h1>\n__META__\n    <\/div>\n    <span class=\"badge\"><i><\/i>完全离线可用<\/span>\n  <\/header>\n\n  <section class=\"card tools\">\n    <div class=\"row\">\n      <button class=\"play\" id=\"play\"><span class=\"ico i-play\"><\/span><span id=\"playtxt\">播放<\/span><\/button>\n      <button class=\"btn lg\" id=\"restart\" title=\"回到开头重新播放\"><span class=\"rt\">↺<\/span>重头播放<\/button>\n      <button class=\"btn lg\" id=\"fs\" title=\"全屏显示，只留谱子 —— 适合投屏给学生看（ESC 退出）\">\n        <svg viewBox=\"0 0 16 16\" width=\"14\" height=\"14\" aria-hidden=\"true\">\n          <path d=\"M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4\"\n                fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"\n                stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n        <\/svg>全屏\n      <\/button>\n__VOICECHECKS__\n      <div class=\"field\" style=\"margin-left:auto\">\n        <button class=\"btn mini\" id=\"hear\">听起始音<\/button>\n        <button class=\"btn mini\" id=\"print\">打印乐谱<\/button>\n      <\/div>\n    <\/div>\n\n    <div class=\"row\">\n      <div class=\"field\">\n        <span class=\"lbl\">速度<\/span>\n        <input type=\"range\" class=\"bpm vg\" id=\"bpm\" min=\"40\" max=\"132\" step=\"1\" value=\"80\">\n        <span class=\"num\" id=\"bpmnum\">♩=80<\/span>\n      <\/div>\n      <div class=\"field\">\n        <button class=\"btn mini\" data-bpm=\"60\">60<\/button>\n        <button class=\"btn mini\" data-bpm=\"72\">72<\/button>\n        <button class=\"btn mini\" data-bpm=\"84\">84<\/button>\n        <button class=\"btn mini\" data-bpm=\"96\">96<\/button>\n        <button class=\"btn mini\" data-bpm=\"108\">108<\/button>\n      <\/div>\n      <div class=\"field\" style=\"margin-left:auto\">\n        <label class=\"chk\" style=\"--c:#0f172a\"><input type=\"checkbox\" id=\"mPrep\" checked>预备拍 4 拍<\/label>\n        <label class=\"chk\" style=\"--c:#0f172a\"><input type=\"checkbox\" id=\"mMetro\">节拍器<\/label>\n        <label class=\"chk\" style=\"--c:#0f172a\"><input type=\"checkbox\" id=\"mLoop\">循环<\/label>\n      <\/div>\n    <\/div>\n\n    <div class=\"row\">\n__VOICEVOLS__\n      <div class=\"field\" style=\"margin-left:auto\">\n        <span class=\"lbl\">总音量<\/span>\n        <input type=\"range\" class=\"vol vg\" id=\"v0\" min=\"0\" max=\"100\" step=\"1\" value=\"88\">\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <section class=\"card\" id=\"scorecard\">\n    <div class=\"scorehead\">\n      <div class=\"t\">__SCOREHEAD__<\/div>\n      <div class=\"jkey\">__JKEY__<\/div>\n    <\/div>\n\n    <div class=\"scorewrap\"><div class=\"score\" id=\"score\"><\/div><\/div>\n\n    <div class=\"stage\">\n      <div class=\"prep\" id=\"prep\">\n        <span class=\"cap\">预备<\/span>\n        <div class=\"pcell strong\" data-p=\"0\">1<\/div>\n        <div class=\"pcell\" data-p=\"1\">2<\/div>\n        <div class=\"pcell strong\" data-p=\"2\">3<\/div>\n        <div class=\"pcell\" data-p=\"3\">4<\/div>\n      <\/div>\n      <div class=\"readout\" id=\"readout\"><small>准备就绪 · 第 5 拍进入<\/small><\/div>\n      <div class=\"pulse\">\n        <span class=\"dot s\" data-b=\"0\"><\/span>\n        <span class=\"dot w\" data-b=\"1\"><\/span>\n      <\/div>\n    <\/div>\n  <\/section>\n\n  <div class=\"foot\">\n    <div>\n      勾选声部＝该声部弹奏；播放中也能实时勾掉某一声部，把那一句交给学生唱。<br>\n      点乐谱上任何一个音符，就从那个音开始播放；快捷：<kbd>空格<\/kbd>播放 / 暂停　<kbd>1<\/kbd><kbd>2<\/kbd>切换声部　<kbd>R<\/kbd>重头播放<br>\n      投屏用「全屏」：屏幕上只留谱子，鼠标一动右上角出现退出按钮，按 <kbd>ESC<\/kbd> 同样可退出。\n    <\/div>\n    <div class=\"note-warn\">由「小视唱 · 小学音乐简谱练习曲生成器」生成 · 钢琴音源已内嵌于本文件，无需联网。钢琴音色：FluidR3_GM SoundFont（Frank Wen），预渲染采样来自 gleitz/midi-js-soundfonts。<\/div>\n  <\/div>\n<\/div>\n\n<div class=\"fsbar\" id=\"fsbar\">\n  <button class=\"fsquit\" id=\"fsquit\" title=\"退出全屏（也可以直接按 ESC）\">\n    <svg viewBox=\"0 0 16 16\" width=\"15\" height=\"15\" aria-hidden=\"true\">\n      <path d=\"M3 3l10 10M13 3L3 13\" fill=\"none\" stroke=\"currentColor\"\n            stroke-width=\"1.9\" stroke-linecap=\"round\"/>\n    <\/svg>退出全屏\n  <\/button>\n<\/div>\n\n<div class=\"tip\" id=\"tip\">从此处播放<\/div>\n\n<script>\n/* ============================================================\n   三度二声部视唱练习 —— 单文件离线版\n   1 = C（中央 C），四分音符为一拍，2/4，16 小节\n   二声部 = 一声部上方三度（平行三度）\n   ============================================================ */\n\n__DATA__\n\n/* 采样音高表：由 samples/manifest.json 生成（见 piano.py） */\nconst SAMPLE_MIDI = {\n  A3: 57, Bb3: 58, B3: 59, C4: 60, Db4: 61, D4: 62,\n  Eb4: 63, E4: 64, F4: 65, Gb4: 66, G4: 67, Ab4: 68,\n  A4: 69, Bb4: 70, B4: 71, C5: 72, Db5: 73, D5: 74,\n  Eb5: 75, E5: 76,\n};\nconst SAMPLE_KEYS = Object.keys(SAMPLE_MIDI);\n/* 按半音差找最近的采样，并给出播放速率。\n   现在的采样集覆盖 MIDI 57–76 每个半音，而音域上限就是 57–76，\n   所以正常情况 rate 恒为 1；这个函数留着是为音域外的音兜底。 */\nfunction nearestSample(midi){\n  let name = SAMPLE_KEYS[0], bd = 1e9;\n  for(const k of SAMPLE_KEYS){\n    const d = Math.abs(SAMPLE_MIDI[k] - midi);\n    if(d < bd){ bd = d; name = k; }\n  }\n  return { name, rate: Math.pow(2, (midi - SAMPLE_MIDI[name]) / 12) };\n}\n\nconst PIANO = __PIANO__;\nconst NGAIN = __NGAIN__;\n\n/* ---------- 摊平成时间线 ---------- */\nVOICES.forEach(v=>{\n  v.timeline = [];\n  let beat = 0;\n  v.measures.forEach((notes, mi)=>{\n    notes.forEach(([deg, dur, oct, midi])=>{\n      oct = oct || 0;\n      const near = nearestSample(midi);\n      v.timeline.push({ beat, dur, deg, oct, midi,\n                        sample: near.name, rate: near.rate, measure:mi, el:null });\n      beat += dur;\n    });\n  });\n});\n\n/* ---------- 状态 ---------- */\nconst S = {\n  ctx:null, buffers:{}, master:null, partGain:{}, metroGain:null, prepGain:null, noise:null,\n  mode:'stopped',            // stopped | playing | paused\n  raf:0, notes:[], spb:0.75, loop:false,\n  origin:0, pausePos:0,      // origin = 第 0 拍对应的音频时刻；pausePos = 暂停时所在拍位（可为负，处于预备拍）\n  sel:{p1:true, p2:true}, prep:true, metro:false, vol:{p1:.85, p2:.85, master:.88}\n};\nconst $ = id => document.getElementById(id);\n\n/* ---------- 渲染乐谱 ---------- */\n/* mps = 每个谱表排几个小节。\n   普通页面 8 个一行（16 小节分两行）；全屏投屏时按屏幕形状重排：\n   横屏仍 8 个一行，竖屏（如 9:16 的屏）改成 4 个一行，内容形状更贴近屏幕，缩放后填得更满。\n   所以这个函数可以被重复调用，重排时会把 DOM 与 timeline 重新挂一次 */\nlet curMPS = 0;\nfunction renderScore(mps){\n  const host = $('score');\n  const sysCount = TOTAL_MEASURES / mps;\n  host.innerHTML = '';\n\n  for(let s=0; s<sysCount; s++){\n    const from = s * mps, to = from + mps;\n    const sys = document.createElement('div'); sys.className = 'system';\n    const grid = document.createElement('div'); grid.className = 'grid';\n    grid.style.gridTemplateColumns = '64px repeat(' + mps + ', minmax(0,1fr))';\n\n    // 小节号\n    grid.appendChild(cell('lab mnum', ''));\n    for(let m=from; m<to; m++) grid.appendChild(cell('mnum', String(m+1)));\n\n    VOICES.forEach(v=>{\n      grid.appendChild(cell('lab ' + v.cls, v.name));\n      for(let m=from; m<to; m++){\n        const mc = document.createElement('div');\n        mc.className = 'meas ' + v.cls + (m === to-1 ? ' last' : '');\n        const notes = v.measures[m];\n        let i = 0;\n        let pos = 0;                     // 当前音在小节里的起点（拍），用来按\"拍\"分组横梁\n        while(i < notes.length){\n          if(notes[i][1] < 1){\n            /* 连续短音符归成一组，下划线连成一条横梁 —— 但**横梁不跨整拍**。\n               我们的拍号（2/4、3/4、4/4）拍单位都是四分音符。\n               判据：**整组必须落在同一拍之内**（起点所在的拍 == 终点所在的拍，\n               终点正好压在拍上算同一拍）。于是 4 个八分（= 2 拍）画成\n               前 2 个一条 + 后 2 个一条；4 个十六分（= 1 拍）仍是一条横梁、配两条线。\n\n               为什么不用\"下一个音是否正好落在整拍上\"这个更简单的判据：\n               挡不住\"自己就跨拍\"的音——比如 2/4 里 [0.5, 0.25, 0.75, 0.5]，\n               第三个音是 0.75 起、跨到 1.5 拍，它的起点并不在整拍上，\n               按简单判据会把 4 个音全归一组、横梁横跨 2 拍（实测确实如此）。\n               按拍分组才能一眼看出拍子结构。（用户 2026-09-29 指出） */\n            const beam = document.createElement('span');\n            beam.className = 'beam';\n            let beamDur = 0;                 // 整组的时值合计，作为它在小节里占的拍位槽宽\n            const beamFrom = pos;            // 这组的起点（拍）\n            let fits = true;\n            while(i < notes.length && notes[i][1] < 1 && fits){\n              /* ⚠ 必须**收之前**判，不能收完再判。\n                 收完再判会把多出来的那个音留在组里：实测 [0.5,0.5,0.5] 会变成\n                 \"三个音一组、横跨 0→1.5 拍\"——因为收完第二个音后整组正好到 1.0（还算同一拍），\n                 第三个音收进来才越界，而那时它已经在组里了。\n                 组内第一个音无条件收（beamDur === 0）：它自己就跨拍时，\n                 下一次判定会立刻把循环收掉，这组就只剩它一个。 */\n              fits = beamDur === 0 ||\n                     Math.floor(beamFrom + 1e-9) === Math.floor(pos + notes[i][1] - 1e-9);\n              if(!fits) break;\n              beamDur += notes[i][1];\n              beam.appendChild(buildNote(v, notes[i][0], notes[i][1], notes[i][2] || 0));\n              pos += notes[i][1];\n              i++;\n            }\n            beam.style.flexGrow = String(beamDur);\n            mc.appendChild(beam);\n          } else {\n            mc.appendChild(buildNote(v, notes[i][0], notes[i][1], notes[i][2] || 0));\n            pos += notes[i][1];\n            i++;\n          }\n        }\n        grid.appendChild(mc);\n      }\n    });\n\n    sys.appendChild(grid);\n    host.appendChild(sys);\n  }\n\n  // DOM 挂回 timeline（数量必须一致，否则高亮会错位）\n  VOICES.forEach(v=>{\n    const groups = host.querySelectorAll('.ng[data-v=\"' + v.id + '\"]');\n    if(groups.length !== v.timeline.length){\n      console.error('乐谱渲染与时间线不一致：' + v.id + ' 渲染 ' + groups.length +\n                    ' 个音符，时间线 ' + v.timeline.length + ' 个');\n    }\n    v.timeline.forEach((n,i)=>{\n      n.el = groups[i];\n      if(n.el) n.el.dataset.i = i;      // 供「从此处播放」查拍位\n    });\n    v.el = Array.from(groups);          // 声部变暗要用，重排后必须重新取\n  });\n\n  function cell(cls, txt){\n    const d = document.createElement('div'); d.className = cls;\n    if(txt) d.textContent = txt;\n    return d;\n  }\n\n  function buildNote(v, deg, dur, oct){\n    const span = document.createElement('span');\n    /* 下划线：八分一根、附点八分也要一根（原版只认 0.5，0.75 会漏线）、\n       十六分两根。线本身是 ::after / ::before 画的（见样式表） */\n    span.className = 'ng' + (dur === 0.5 || dur === 0.75 ? ' e8'\n                             : (dur === 0.25 ? ' e16' : ''));\n    span.dataset.v = v.id;\n    /* 拍位槽：宽度按时值分配（见 .meas > * 那条注释）。只有一个音的小节\n       因此落在第 1 拍的位置，而不是被 space-evenly 居中。\n       data-dur 是给校验脚本读的——按\"第几拍\"对账要用到它。 */\n    span.style.flexGrow = String(dur);\n    span.dataset.dur = String(dur);\n\n    const d = document.createElement('span');\n    d.className = 'd';\n    const dn = document.createElement('span');\n    dn.className = 'dn';\n    dn.textContent = deg;\n    if(oct === 1){\n      const o = document.createElement('i'); o.className = 'oct'; dn.appendChild(o);\n    } else if(oct === -1){\n      const o = document.createElement('i'); o.className = 'oct low'; dn.appendChild(o);\n    }\n    d.appendChild(dn);\n\n    if(dur === 0.75 || dur === 1.5){ const a = document.createElement('i'); a.className = 'aug'; d.appendChild(a); }\n    span.appendChild(d);\n\n    if(dur >= 2){\n      const dash = document.createElement('span');\n      dash.className = 'dash';\n      dash.textContent = '－'.repeat(Math.round(dur) - 1);\n      span.appendChild(dash);\n    }\n    return span;\n  }\n}\nrenderScore(MEAS_PER_SYSTEM);\ncurMPS = MEAS_PER_SYSTEM;\n\n/* ---------- 音频 ---------- */\nfunction b64ToBuffer(b64){\n  const bin = atob(b64), len = bin.length, bytes = new Uint8Array(len);\n  for(let i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);\n  return bytes.buffer;\n}\nfunction decodeOne(b64){\n  const buf = b64ToBuffer(b64);\n  return new Promise((res, rej)=>{\n    const p = S.ctx.decodeAudioData(buf, res, rej);\n    if(p && typeof p.then === 'function') p.then(res, rej);\n  });\n}\nasync function initAudio(){\n  if(S.ctx) return;\n  const AC = window.AudioContext || window.webkitAudioContext;\n  S.ctx = new AC();\n\n  S.master = S.ctx.createGain();\n  S.master.gain.value = S.vol.master;\n  S.master.connect(S.ctx.destination);\n\n  ['p1','p2'].forEach(id=>{\n    const g = S.ctx.createGain();\n    g.gain.value = S.sel[id] ? S.vol[id] : 0;\n    g.connect(S.master);\n    S.partGain[id] = g;\n  });\n\n  S.metroGain = S.ctx.createGain();\n  S.metroGain.gain.value = S.metro ? 0.5 : 0;\n  S.metroGain.connect(S.master);\n\n  S.prepGain = S.ctx.createGain();\n  S.prepGain.gain.value = 0.85;\n  S.prepGain.connect(S.master);\n\n  // 节拍器用的噪声源（白噪声 0.1s，做击打瞬态）\n  const n = Math.floor(S.ctx.sampleRate * 0.1);\n  S.noise = S.ctx.createBuffer(1, n, S.ctx.sampleRate);\n  const nd = S.noise.getChannelData(0);\n  for(let i=0;i<n;i++) nd[i] = Math.random()*2 - 1;\n\n  await Promise.all(Object.keys(PIANO).map(async k=>{\n    S.buffers[k] = await decodeOne(PIANO[k]);\n  }));\n}\n\n/* 节拍器音：干脆短促的\"嗒\"。强拍音高更高、更响，形成经典的高低交替 */\nfunction click(t, strong, dest){\n  const f = strong ? 2000 : 1480;\n\n  // 主击点：正弦，2ms 起振、70ms 衰减\n  const o = S.ctx.createOscillator(), g = S.ctx.createGain();\n  o.type = 'sine';\n  o.frequency.setValueAtTime(f, t);\n  g.gain.setValueAtTime(0.0001, t);\n  g.gain.exponentialRampToValueAtTime(strong ? 0.40 : 0.28, t + 0.0015);\n  g.gain.exponentialRampToValueAtTime(0.0001, t + (strong ? 0.075 : 0.060));\n  o.connect(g); g.connect(dest);\n  o.start(t); o.stop(t + 0.12);\n\n  // 极短噪声击打：给\"机械\"的擦感，去掉电子味的纯嗡声\n  const s = S.ctx.createBufferSource();\n  s.buffer = S.noise;\n  const hp = S.ctx.createBiquadFilter();\n  hp.type = 'highpass';\n  hp.frequency.value = strong ? 2800 : 2200;\n  const ng = S.ctx.createGain();\n  ng.gain.setValueAtTime(strong ? 0.26 : 0.17, t);\n  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.020);\n  s.connect(hp); hp.connect(ng); ng.connect(dest);\n  s.start(t); s.stop(t + 0.05);\n}\n\n/* 弹一个音。bufOffset = 从采样内部第几秒开始（暂停后续播时用，衔接才不会有断口） */\nfunction spawnNote(n, t, dest, isLast, bufOffset){\n  const amp = NGAIN[n.sample] || 1;\n  const skip = bufOffset || 0;\n  const src = S.ctx.createBufferSource();\n  src.buffer = S.buffers[n.sample];\n  src.playbackRate.value = n.rate || 1;   // 采样只覆盖 C4–C5，靠平移补齐 A3–E5\n  const g = S.ctx.createGain();\n  g.gain.value = amp;\n  src.connect(g); g.connect(dest);\n  src.start(t, skip);\n\n  const remain = Math.max(0.05, n.dur * S.spb - skip);\n  const off = t + remain;\n  const rel = isLast ? 1.6 : 0.42;\n  g.gain.setValueAtTime(amp, off);\n  g.gain.linearRampToValueAtTime(0.0001, off + rel);\n  try{ src.stop(off + rel + 0.06); }catch(e){}\n\n  S.notes.push({ src, g });\n}\n\n/* ---------- 播放引擎 ----------\n   时间模型：origin = 第 0 拍所在的音频时刻。\n   当前拍位 p = (ctx.currentTime - origin) / 每拍秒数。\n   预备 4 拍占用 -4 ~ -1 拍，乐曲从第 0 拍开始。\n   暂停 → 只记下拍位并停掉已排程的音；继续 → 从该拍位重新排程剩余音符，\n   正在响的那个音用采样内部偏移接上，听感是接着放，不是重头。            */\n\nfunction scheduleFrom(p, t0){\n  if(S.prep){\n    for(let i=0;i<PREP_BEATS;i++){\n      const bp = i - PREP_BEATS;                  // -4 -3 -2 -1\n      if(bp >= p - 1e-9) click(t0 + (bp - p)*S.spb, i%2===0, S.prepGain);\n    }\n  }\n  VOICES.forEach(v=>{\n    if(!S.sel[v.id]) return;\n    const dest = S.partGain[v.id];\n    v.timeline.forEach((n,i)=>{\n      if(n.beat + n.dur <= p) return;             // 已经过去\n      const skip = Math.max(0, p - n.beat);       // 该音已播过的时长（拍）\n      spawnNote(n, t0 + Math.max(0, n.beat - p)*S.spb, dest,\n                i === v.timeline.length-1, skip * S.spb);\n    });\n  });\n  if(S.metro){\n    for(let i=0;i<TOTAL_BEATS;i++){\n      if(i >= p - 1e-9) click(t0 + (i - p)*S.spb, i%2===0, S.metroGain);\n    }\n  }\n}\n\nfunction startFrom(p, lead){\n  const t0 = S.ctx.currentTime + lead;\n  S.origin = t0 - p * S.spb;\n  S.mode = 'playing';\n  S.notes = [];\n  scheduleFrom(p, t0);\n  cancelAnimationFrame(S.raf);\n  tick();\n}\n\n/* 快速淡出全部已排程音符（暂停 / 重头时用，避免咔哒声） */\nfunction fadeNotes(){\n  if(!S.ctx) return;\n  const now = S.ctx.currentTime;\n  S.notes.forEach(o=>{\n    try{\n      o.g.gain.cancelScheduledValues(now);\n      o.g.gain.setTargetAtTime(0.0001, now, 0.012);\n      o.src.stop(now + 0.12);\n    }catch(e){}\n  });\n  S.notes = [];\n}\n\n/* 音频起不来时别静默失败——给一句人话，用户才知道该换浏览器 */\nfunction audioFail(e){\n  console.error(e);\n  $('readout').innerHTML = '<small>这台设备的浏览器拦住了音频，换个浏览器（Chrome / Edge / Safari）再试<\/small>';\n}\n\n/* 播放 / 暂停 / 继续 */\nasync function playPause(){\n  if(S.mode === 'playing'){ pause(); return; }\n  try{ await initAudio(); if(S.ctx.state === 'suspended') await S.ctx.resume(); }\n  catch(e){ return audioFail(e); }\n  if(S.mode === 'paused'){\n    S.spb = 60 / (+$('bpm').value);        // 暂停期间可调速，按拍位续播不受影响\n    startFrom(Math.max(S.pausePos, S.prep ? -PREP_BEATS : 0), 0.07);\n  } else {\n    S.spb = 60 / (+$('bpm').value);\n    clearHighlight(); setPrep(-1);\n    pulseEls.forEach(d=>d.classList.remove('on'));\n    startFrom(S.prep ? -PREP_BEATS : 0, 0.22);\n  }\n  setUI();\n}\n\nfunction pause(){\n  if(S.mode !== 'playing') return;\n  S.pausePos = (S.ctx.currentTime - S.origin) / S.spb;\n  S.mode = 'paused';\n  cancelAnimationFrame(S.raf);\n  fadeNotes();\n  setUI();\n  $('readout').innerHTML += '<small>　已暂停<\/small>';\n}\n\n/* 重头播放 */\nasync function restart(){\n  try{ await initAudio(); if(S.ctx.state === 'suspended') await S.ctx.resume(); }\n  catch(e){ return audioFail(e); }\n  if(S.mode !== 'stopped'){ cancelAnimationFrame(S.raf); fadeNotes(); }\n  S.spb = 60 / (+$('bpm').value);\n  clearHighlight(); setPrep(-1);\n  pulseEls.forEach(d=>d.classList.remove('on'));\n  S.pausePos = 0;\n  startFrom(S.prep ? -PREP_BEATS : 0, 0.22);\n  setUI();\n}\n\n/* 从指定拍位开始播放（点乐谱音符触发；不加预备拍，直接进入） */\nasync function playFrom(beat){\n  try{ await initAudio(); if(S.ctx.state === 'suspended') await S.ctx.resume(); }\n  catch(e){ return audioFail(e); }\n  if(S.mode !== 'stopped'){ cancelAnimationFrame(S.raf); fadeNotes(); }\n  S.spb = 60 / (+$('bpm').value);\n  clearHighlight(); setPrep(-1);\n  pulseEls.forEach(d=>d.classList.remove('on'));\n  S.pausePos = beat;\n  startFrom(beat, 0.12);\n  setUI();\n}\n\nfunction finish(){\n  fadeNotes();\n  S.mode = 'stopped';\n  S.pausePos = 0;\n  cancelAnimationFrame(S.raf);\n  clearHighlight();\n  setPrep(-1);\n  pulseEls.forEach(d=>d.classList.remove('on'));\n  $('readout').innerHTML = '<small>已播完 · 点播放从头开始<\/small>';\n  setUI();\n}\n\nlet activeEls = [];\nfunction clearHighlight(){\n  activeEls.forEach(el=>el.classList.remove('on'));\n  activeEls = [];\n}\n\nfunction tick(){\n  if(S.mode !== 'playing') return;\n  const p = (S.ctx.currentTime - S.origin) / S.spb;\n\n  if(p < 0){\n    const i = Math.max(0, Math.min(PREP_BEATS-1, Math.floor(p + PREP_BEATS)));\n    setPrep(i);\n    $('readout').innerHTML = '<small>预备 ' + (i+1) + ' / 4 · 第 5 拍进入<\/small>';\n  } else if(p >= TOTAL_BEATS){\n    if(S.loop){ fadeNotes(); startFrom(S.prep ? -PREP_BEATS : 0, 0.05); return; }\n    finish();\n    return;\n  } else {\n    setPrep(-1);\n    paint(p);\n  }\n  S.raf = requestAnimationFrame(tick);\n}\n\nfunction paint(beat){\n  clearHighlight();\n  VOICES.forEach(v=>{\n    if(!S.sel[v.id]) return;\n    const n = v.timeline.find(n => beat >= n.beat - 1e-6 && beat < n.beat + n.dur - 1e-6);\n    if(n && n.el){ n.el.classList.add('on'); activeEls.push(n.el); }\n  });\n  const mi = Math.floor(beat / BEATS_PER_MEASURE);\n  const bi = Math.floor(beat - mi*BEATS_PER_MEASURE);\n  $('readout').innerHTML = '第 <b>' + (mi+1) + '<\/b> 小节 · 第 <b>' + (bi+1) + '<\/b> 拍' +\n    '<small>　共 ' + TOTAL_MEASURES + ' 小节<\/small>';\n  pulseEls.forEach((d,i)=> d.classList.toggle('on', i===bi));\n}\n\n/* ---------- UI ---------- */\nconst pulseEls = Array.from(document.querySelectorAll('.pulse .dot'));\nconst prepEls  = Array.from(document.querySelectorAll('.pcell'));\nfunction setPrep(i){ prepEls.forEach((el,k)=> el.classList.toggle('on', k===i)); }\nfunction setUI(){\n  const playing = S.mode === 'playing';\n  const b = $('play');\n  b.classList.toggle('on', playing);\n  const ic = b.querySelector('.ico');\n  ic.classList.toggle('i-play', !playing);\n  ic.classList.toggle('i-pause', playing);\n  $('playtxt').textContent = playing ? '暂停' : (S.mode === 'paused' ? '继续' : '播放');\n  $('bpm').disabled = playing;\n  document.querySelectorAll('[data-bpm]').forEach(x=> x.disabled = playing);\n}\n\nfunction applyGain(id){\n  if(!S.ctx) return;\n  S.partGain[id].gain.setTargetAtTime(S.sel[id] ? S.vol[id] : 0.0001, S.ctx.currentTime, 0.02);\n}\nfunction dimVoice(id){\n  VOICES.find(v=>v.id===id).el.forEach(el=> el.style.opacity = S.sel[id] ? '' : '.22');\n}\n$('c1').addEventListener('change', e=>{ S.sel.p1 = e.target.checked; applyGain('p1'); dimVoice('p1'); });\n$('c2').addEventListener('change', e=>{ S.sel.p2 = e.target.checked; applyGain('p2'); dimVoice('p2'); });\n\n$('bpm').addEventListener('input', e=>{ $('bpmnum').textContent = '♩=' + e.target.value; });\ndocument.querySelectorAll('[data-bpm]').forEach(btn=>{\n  btn.addEventListener('click', ()=>{\n    $('bpm').value = btn.dataset.bpm;\n    $('bpmnum').textContent = '♩=' + btn.dataset.bpm;\n  });\n});\n\n$('v1').addEventListener('input', e=>{ S.vol.p1 = e.target.value/100; applyGain('p1'); });\n$('v2').addEventListener('input', e=>{ S.vol.p2 = e.target.value/100; applyGain('p2'); });\n$('v0').addEventListener('input', e=>{\n  S.vol.master = e.target.value/100;\n  if(S.master) S.master.gain.setTargetAtTime(S.vol.master, S.ctx.currentTime, 0.02);\n});\n\n$('mPrep').addEventListener('change', e=>{\n  S.prep = e.target.checked;\n  $('prep').classList.toggle('off', !S.prep);\n  if(!S.prep && S.mode === 'stopped') $('readout').innerHTML = '<small>预备拍已关闭 · 直接进入<\/small>';\n});\n$('mMetro').addEventListener('change', e=>{\n  S.metro = e.target.checked;\n  if(S.ctx && S.metroGain) S.metroGain.gain.setTargetAtTime(S.metro?0.5:0.0001, S.ctx.currentTime, 0.02);\n});\n$('mLoop').addEventListener('change', e=>{ S.loop = e.target.checked; });\n\n$('play').addEventListener('click', playPause);      // 播放 / 暂停 / 继续\n$('restart').addEventListener('click', restart);     // 重头播放\n\n/* 乐谱：悬停提示「从此处播放」，点击即从该音开始 */\nconst tipEl = $('tip');\nlet tipOn = null;\nfunction showTip(ng){\n  const r = ng.getBoundingClientRect();\n  const w = tipEl.offsetWidth || 84, h = tipEl.offsetHeight || 22;\n  let x = r.left + r.width/2;\n  x = Math.max(w/2 + 8, Math.min(window.innerWidth - w/2 - 8, x));\n  tipEl.style.left = x + 'px';\n  if(r.top - 7 - h < 4){                      // 上方放不下就翻到音符下方\n    tipEl.style.top = (r.bottom + 7) + 'px';\n    tipEl.style.transform = 'translate(-50%,0)';\n  } else {\n    tipEl.style.top = (r.top - 7) + 'px';\n    tipEl.style.transform = 'translate(-50%,-100%)';\n  }\n  tipEl.classList.add('on');\n}\nfunction hideTip(){ tipEl.classList.remove('on'); tipOn = null; }\n\n$('score').addEventListener('mouseover', e=>{\n  const ng = e.target.closest ? e.target.closest('.ng') : null;\n  if(ng === tipOn) return;\n  tipOn = ng;\n  if(ng) showTip(ng); else hideTip();\n});\n$('score').addEventListener('mouseleave', hideTip);\nwindow.addEventListener('scroll', hideTip, true);\nwindow.addEventListener('resize', hideTip);\ndocument.addEventListener('click', e=>{\n  const ng = e.target.closest ? e.target.closest('.ng') : null;\n  if(!ng) return;\n  const v = VOICES.find(x => x.id === ng.dataset.v);\n  const n = v && v.timeline[+ng.dataset.i];\n  hideTip();\n  if(n) playFrom(n.beat);\n});\n\n/* 听起始音：依次弹各声部的第一个音 */\n$('hear').addEventListener('click', async ()=>{\n  if(S.mode === 'playing') return;\n  await initAudio();\n  if(S.ctx.state === 'suspended') await S.ctx.resume();\n  const t0 = S.ctx.currentTime + 0.1;\n  let k = 0;\n  VOICES.forEach(v=>{\n    if(!S.sel[v.id]) return;\n    const n = v.timeline[0], amp = NGAIN[n.sample] || 1, at = t0 + k*0.95;\n    const g = S.ctx.createGain();\n    g.gain.value = amp; g.connect(S.master);\n    const src = S.ctx.createBufferSource();\n    src.buffer = S.buffers[n.sample];\n    src.playbackRate.value = n.rate || 1;\n    src.connect(g); src.start(at);\n    g.gain.setValueAtTime(amp, at + 0.9);\n    g.gain.linearRampToValueAtTime(0.0001, at + 1.5);\n    try{ src.stop(at + 1.6); }catch(e){}\n    k++;\n  });\n  if(k === 0){\n    const b = $('hear'); b.textContent = '请先勾选声部';\n    setTimeout(()=> b.textContent = '听起始音', 1200);\n  }\n});\n\n$('print').addEventListener('click', ()=> window.print());\n\n/* ============================================================\n   全屏（投屏）模式\n   —— 只留谱子，交给学生看；操作/说明/状态栏全部藏起来\n   —— 鼠标一动，右上角浮出「退出全屏」；也可按 ESC\n   ============================================================ */\nlet fsOn = false, fsTimer = 0;\n\n/* 让退出按钮亮一下，停 2.6 秒自己收回，免得一直挡在谱子上 */\nfunction pokeFs(){\n  if(!fsOn) return;\n  $('fsbar').classList.add('on');\n  clearTimeout(fsTimer);\n  fsTimer = setTimeout(()=> $('fsbar').classList.remove('on'), 2600);\n}\n\nasync function enterFs(){\n  const el = document.documentElement;\n  try{\n    if(el.requestFullscreen) await el.requestFullscreen({ navigationUI:'hide' });\n    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();\n  }catch(e){\n    /* iOS Safari 之类不允许整页真全屏，那就退化成「页面内全屏」：\n       body.fs 把操作区全藏掉、谱面铺满视口，观感一致，只是浏览器标签栏还在 */\n  }\n  setFs(true);\n}\nfunction leaveFs(){\n  try{\n    if(document.fullscreenElement) document.exitFullscreen();\n    else if(document.webkitFullscreenElement) document.webkitExitFullscreen();\n  }catch(e){}\n  setFs(false);\n}\nfunction setFs(on){\n  if(on === fsOn) return;\n  fsOn = on;\n  document.body.classList.toggle('fs', on);\n  clearTimeout(fsTimer);\n  if(on){ relayout(); pokeFs(); }\n  else { $('fsbar').classList.remove('on'); relayout(); }\n}\n\n/* 原生全屏下 ESC 由浏览器接管（同时会派发 fullscreenchange）；\n   页面内全屏没有人管，得自己接 */\ndocument.addEventListener('keydown', e=>{\n  if(e.key === 'Escape' && fsOn && !document.fullscreenElement && !document.webkitFullscreenElement){\n    leaveFs();\n  }\n});\ndocument.addEventListener('fullscreenchange', ()=>{\n  if(fsOn && !document.fullscreenElement) setFs(false);\n});\ndocument.addEventListener('webkitfullscreenchange', ()=>{\n  if(fsOn && !document.webkitFullscreenElement) setFs(false);\n});\ndocument.addEventListener('mousemove', pokeFs);\ndocument.addEventListener('touchstart', pokeFs, { passive:true });\n\n/* 全屏时：先决定一行排几个小节，再把整块谱子等比缩放到刚好填满 */\nconst FS_GEOM = { lab:64, meas:118, mnum:19, gap:78 };   // 与 CSS 里的尺寸对应\nconst FS_ROW  = { min:58, max:190 };\n\n/* 给定「一行几个小节」，算出让谱面宽高比正好等于屏幕宽高比所需的高度与行高。\n   高度对行高是线性的，所以不用真的渲染出来量，直接解出来即可 */\nfunction planFor(mps, availW, availH){\n  const systems = TOTAL_MEASURES / mps;\n  const W = FS_GEOM.lab + mps * FS_GEOM.meas;\n  const fixed = systems * FS_GEOM.mnum + (systems - 1) * FS_GEOM.gap;\n  const want = W * (availH / availW);                       // 想达到的高度\n  let row = (want - fixed) / (2 * systems);\n  row = Math.max(FS_ROW.min, Math.min(FS_ROW.max, row));    // 行高有上下限，太挤太散都不好\n  const H = fixed + 2 * systems * row;\n  const k = Math.min(availW / W, availH / H);\n  return { mps, systems, W, row, H, k, area:(k*W) * (k*H) };   // area = 缩放到屏幕上实际占的面积\n}\n\nfunction relayout(){\n  if(!fsOn && curMPS !== MEAS_PER_SYSTEM){      // 退出全屏 → 恢复页面里的两行排版\n    renderScore(MEAS_PER_SYSTEM);\n    curMPS = MEAS_PER_SYSTEM;\n    activeEls = [];\n    ['p1','p2'].forEach(dimVoice);\n  }\n  fitScore();                                   // 全屏时由 fitScore 挑排版并缩放\n}\n\nfunction fitScore(){\n  const sc = $('score');\n  if(!fsOn){\n    sc.style.transform = ''; sc.style.width = ''; sc.style.removeProperty('--fs-row');\n    $('scorecard').style.paddingTop = '';\n    return;\n  }\n  const vw = window.innerWidth, vh = window.innerHeight;\n  const pad = Math.max(14, Math.round(Math.min(vw, vh) * 0.03));\n  const padT = pad + 52;                  // 顶上给退出按钮留一条，别让按钮压着谱子\n  const availW = vw - pad*2, availH = vh - padT - pad;\n\n  /* 16 小节能排成 16/8/4/2 个小节一行。屏幕是横是竖差别很大，\n     与其按长宽比猜一个阈值，不如每种都算一遍，挑「缩放后占用屏幕面积最大」的那种\n     —— 只看缩放倍数会选错：倍数略大但排得很窄的版式，左右会空出两条 */\n  let best = null;\n  [16, 8, 4, 2].forEach(n=>{\n    const p = planFor(n, availW, availH);\n    if(!best || p.area > best.area) best = p;\n  });\n\n  if(best.mps !== curMPS){\n    renderScore(best.mps);\n    curMPS = best.mps;\n    activeEls = [];                       // 旧节点已从文档里摘掉，留着会按住已消失的音符\n    ['p1','p2'].forEach(dimVoice);        // 重排后把「取消勾选的声部变暗」补回来\n  }\n\n  $('scorecard').style.paddingTop = padT + 'px';   // 谱面在留白下方的区域里居中\n  sc.style.width = best.W + 'px';                  // 确定的排版宽度，量出来的高度才稳定\n  sc.style.setProperty('--fs-row', best.row.toFixed(1) + 'px');\n  sc.style.transform = 'none';\n\n  const r = sc.getBoundingClientRect();\n  if(!r.width || !r.height) return;\n  const k = Math.min(availW / r.width, availH / r.height);\n  sc.style.transform = 'scale(' + k.toFixed(4) + ')';\n}\n\n$('fs').addEventListener('click', enterFs);\n$('fsquit').addEventListener('click', leaveFs);\nwindow.addEventListener('resize', relayout);\nwindow.addEventListener('orientationchange', ()=> setTimeout(relayout, 280));\n\n/* 快捷键 */\ndocument.addEventListener('keydown', e=>{\n  if(e.target.tagName === 'INPUT' && e.target.type === 'range') return;\n  if(e.code === 'Space'){ e.preventDefault(); playPause(); }\n  else if(e.key === '1'){ $('c1').checked = !$('c1').checked; $('c1').dispatchEvent(new Event('change')); }\n  else if(e.key === '2'){ $('c2').checked = !$('c2').checked; $('c2').dispatchEvent(new Event('change')); }\n  else if(e.key === 'r' || e.key === 'R'){ restart(); }\n});\n<\/script>\n<\/body>\n<\/html>\n";</script>

/* 每个学段可选的难度上限（低年级不含十六分音符与附点节奏） */
function levelOpts(stage){
  const cap = R.MAX_LEVEL_BY_STAGE[stage];
  return Object.keys(R.LEVELS).map(Number).sort(function(a, b){ return a - b; })
    .filter(function(n){ return cap === undefined || n <= cap; })
    .map(function(n){ return {v:n, label:R.LEVELS[n].label}; });
}
function pills(key, label, opts, cur){
  return '<div class="fld"><label>' + label + '</label><div class="pills">' +
    opts.map(function(o){

             '" data-k="' + key + '" data-v="' + o.v + '">' + o.label + '</button>';
    }).join('') + '</div></div>';
}
function buildPanel(){
  const stageOpts = ['low','mid','high'].map(function(k){
    return {v:k, label:R.STAGES[k].label};
  });
  const goalOpts = ['scale','interval','rhythm','melody'].map(function(k){

  const lenOpts = R.LENGTHS.map(function(n){ return {v:n, label:n + ' 小节'}; });

/* 把引擎输出压成渲染/播放要的最小结构 */
function toScore(res, seed){

    return {name:v.name,

            })};

  let total = 0;
  res.voices.forEach(function(v){
    let t = 0;
    v.measures.forEach(function(m){ m.forEach(function(n){ t += n.dur; }); });

    voices: voices, base: ENGINE.tonicBase(res.tonic_pc), tonic: res.tonic_pc,
    key: p.key, meter: p.meter, beatsPerMeasure: R.METERS[p.meter][0],

function setTitle(t, sub){

function showMsg(html){

function generate(seed){

  }
  S.score = toScore(res, seed);
  if(S.player) S.player.stop();
  document.getElementById('sheet').innerHTML = scoreHTML(S.score);
  setTitle(S.score.title, S.score.label);
  S.player = setupTransport(S.score, BPM0, true, doExport);
  document.getElementById('usage').hidden = false;      // 出谱之后才显示使用说明
}

/* ---------- 导出：把当次这条曲谱填进「原始离线页」的模板 ----------
   模板是拿最初那个离线版（二声部视唱练习.html）加工出来的，见
   make_offline_template.py。这里只做数据替换，版式、工具栏、全屏、快捷键
   一律沿用原版，不另起一套。 */
function esc(s){
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;');
}
/* 绝对音高 → 简谱（级数 + 八度点数）。base 是「1」所在的不带点八度
   （1=C→60、1=F→65、1=G→67）。生成器只产出调内音级，所以不会出现升降号；
   万一出现（引擎被改坏），退回最近的级数并在控制台点名，不静默把音画错。 */
const DEG_BY_PC = {0:1, 2:2, 4:3, 5:4, 7:5, 9:6, 11:7};
const MAJOR_PC = [0, 2, 4, 5, 7, 9, 11];
function toJianpu(midi, base){
  const off = midi - base;
  const oct = Math.floor(off / 12);
  const pc = ((off % 12) + 12) % 12;        // JS 的 % 对负数带符号，这里要正模
  let deg = DEG_BY_PC[pc];
  if(deg === undefined){
    const near = MAJOR_PC.reduce(function(a, b){
      return Math.abs(b - pc) < Math.abs(a - pc) ? b : a; });
    deg = DEG_BY_PC[near];
    console.warn('调外音：midi=' + midi + '（相对主音 ' + off + ' 个半音），已按最近的调内级数记谱');
  }
  return [deg, oct];
}
function exportFilename(sc){
  let s = sc.label.split('1=').join('');
  [3, 2, 1].forEach(function(n){ s = s.split('★'.repeat(n)).join(n + '星'); });
  /* 字段之间要留分隔符。原来是「不是字母数字汉字就丢掉」，结果「2/4」变成「2-4」、
     又和后面的「16 小节」粘成「2-416小节」——老师看文件名根本读不出来是什么。 */
  let out = '';
  for(const ch of s){
    if(/[0-9A-Za-z]/.test(ch) || /[\u4e00-\u9fff]/.test(ch)) out += ch;
    else if(ch === '/') out += '-';
    else if(ch === '=') out += '-';
    else if(ch === '♭') out += 'b';        // 1=♭E 落到文件名里写作 Eb，不能让它被丢掉只剩 E
    else if(ch === '·' || ch === ' ') out += '_';
  }
  out = out.replace(/_+/g, '_').replace(/^[_-]+|[_-]+$/g, '');
  return '练习曲_' + out + '.html';
}
function metaHTML(sc, two){
  const bits = [
    '<b>' + esc(sc.keyLabel) + '</b>',
    '<b>' + esc(sc.meter) + ' 拍</b>',
    '<b>' + sc.measures + ' 小节</b>',
    '<b>' + esc(sc.levelLabel) + '</b>',
    two ? '二声部 = 一声部上方<b>三度</b>' : '<b>单声部</b>',
    '音色：<b>钢琴</b>'
  ];
  return '<div class="meta">\n        ' +
    bits.map(function(b, i){
      return (i ? '<span class="sep">·</span>\n        ' : '') + '<span>' + b + '</span>';
    }).join('') + '\n      </div>';
}
function voiceChecks(two){
  return '      <div class="field">\n' +
    '        <span class="lbl">声部</span>\n' +
    '        <label class="chk c1"><input type="checkbox" id="c1" checked>声部一</label>\n' +
    '        <label class="chk c2"' + (two ? '' : ' hidden') +
    '><input type="checkbox" id="c2" checked>声部二</label>\n' +
    '      </div>';
}
function voiceVols(two){
  return '      <div class="field">\n' +
    '        <span class="lbl">声部一音量</span>\n' +
    '        <input type="range" class="vol v1" id="v1" min="0" max="100" step="1" value="85">\n' +
    '      </div>\n' +
    '      <div class="field"' + (two ? '' : ' hidden') + '>\n' +
    '        <span class="lbl">声部二音量</span>\n' +
    '        <input type="range" class="vol v2" id="v2" min="0" max="100" step="1" value="85">\n' +
    '      </div>';
}
function fillExportTemplate(sc){
  const total = sc.voices[0].measures.length;
  const two = sc.voices.length > 1;
  /* 模板里的音符是 [简谱级数, 时值, 八度点数, 绝对音高]——第 4 项给发声用，
     采样只有 C4–C5，得靠它算播放速率。 */
  const vv = sc.voices.map(function(v, i){
    return {
      id: 'p' + (i + 1), name: ['声部一', '声部二'][i] || ('声部' + (i + 1)),
      cls: 'p' + (i + 1),
      measures: v.measures.map(function(m){
        return m.map(function(n){
          const jp = toJianpu(n[0], sc.base);
          return [jp[0], n[1], jp[1], n[0]];
        });
      })
    };
  });
  const data =
    '/* 每小节的音符：[简谱级数, 时值(拍), 八度点数(默认0), 绝对音高(MIDI)] */\n' +
    'const VOICES = ' + JSON.stringify(vv) + ';\n\n' +
    'const BEATS_PER_MEASURE = ' + sc.beatsPerMeasure + ';\n' +
    'const MEAS_PER_SYSTEM   = 8;\n' +
    'const TOTAL_MEASURES    = ' + total + ';\n' +
    'const TOTAL_BEATS       = TOTAL_MEASURES * BEATS_PER_MEASURE;   // ' +
      (total * sc.beatsPerMeasure) + '\n' +
    'const PREP_BEATS        = 4;\n';
  const beatWord = {2: '两', 3: '三', 4: '四'}[sc.beatsPerMeasure] || sc.beatsPerMeasure;
  const subtitle = esc(sc.goalLabel) + ' · ' +
    (two ? '平行三度 · 二声部 · 同节奏' : '单声部 · 同节奏');
  return OFFLINE_TPL
    /* 标题和标签页图标一起换：图标本来是原版没有的（原版没有 favicon，
       每次打开都白跑一趟 404）。这里是**唯一的加法**，位置在 head 里，
       不参与任何布局，所以下面对骨架逐项比的时候它不构成差异。 */
    .replace('<title>__TITLE__</title>',
             '<title>' + esc(sc.title + ' · ' + sc.keyLabel + ' ' + sc.meter + ' · ' + total +
                              '小节 · 小视唱') +
             '</title>\n<link rel="icon" href="' + ICON + '">')
    .replace('<h1>__H1__</h1>', '<h1>' + esc(sc.title) + '</h1>')
    .replace('__META__', metaHTML(sc, two))
    .replace('<div class="t">__SCOREHEAD__</div>',
             '<div class="t">视唱谱<span>' + subtitle + '</span></div>')
    .replace('<div class="jkey">__JKEY__</div>',
             '<div class="jkey"><b>' + esc(sc.meter) + '</b><span>四分音符为一拍 · 每小节' +
             beatWord + '拍</span></div>')
    .replace('__VOICECHECKS__', voiceChecks(two))
    .replace('__VOICEVOLS__', voiceVols(two))
    .replace('const PIANO = __PIANO__;', 'const PIANO = ' + JSON.stringify(PIANO) + ';')
    /* 归一化增益也得跟着换。模板是从参考页派生的，里面那张 NGAIN 只有原来 8 个音，
       新采样的名字一个都查不到 → `NGAIN[名] || 1` 全部退化成 1，而源采样只有
       −20.8 dBFS，结果就是整条谱安静 14 dB。这种错不会报任何东西。 */
    .replace('const NGAIN = __NGAIN__;', 'const NGAIN = ' + JSON.stringify(NGAIN) + ';')
    .replace('__DATA__', data);
}
const OFFLINE_MARKS = ['__TITLE__', '__H1__', '__META__', '__SCOREHEAD__', '__JKEY__',
                       '__VOICECHECKS__', '__VOICEVOLS__', '__PIANO__', '__NGAIN__', '__DATA__'];
function buildExportHTML(sc){
  const html = fillExportTemplate(sc);
  /* 占位符没填完就抛。不抛的话，老师会拿到一个上面印着 __META__ 的谱子——
     能打开、能播，就是内容不对，这种错最难被发现。 */
  const left = OFFLINE_MARKS.filter(function(m){ return html.indexOf(m) >= 0; });
  if(left.length){
    throw new Error('导出包模板有占位符没填上：' + left.join('、') +
                    '（先跑 python3 make_offline_template.py 再重新构建）');
  }
  return html;
}

/* 点导出之后到底有没有下载成，页面是不知道的——只能防住"连机会都没有"的那种情况。
   实测：本页被嵌在 iframe 里、而那个 iframe 的 sandbox 没给 allow-downloads 时，
   a[download] 的下载会被浏览器**静默丢掉**：不下载、不报错、控制台也干净，
   表现就是"点了没反应"。所以被嵌时额外给一条绕开的路，并把地址显示出来让老师能复制。 */
function inFrame(){
  try { return window.self !== window.top; }
  catch(e) { return true; }        // 取不到 top 说明跨域被嵌，同样属于被嵌
}
function showExportHint(name){
  const box = document.getElementById('expHint');
  if(!box) return;
  box.hidden = false;
  box.innerHTML =
    '<b>已生成：' + esc(name) + '</b><br>' +
    '如果上面没有出现「保存文件」的提示，是因为本页被嵌在别的地方预览，' +
    '浏览器会拦掉下载。点下面的按钮在新标签页打开本页，再点一次「导出离线包」即可；' +
    '也可以把下面这个地址复制到浏览器地址栏打开。' +
    '<div class="acts"><button class="tp primary" id="openTab">在新标签页打开本页</button>' +
    '<input id="pageUrl" readonly></div>';
  document.getElementById('pageUrl').value = location.href;
  document.getElementById('openTab').addEventListener('click', function(){
    const w = window.open(location.href, '_blank');
    if(!w) alert('新标签页也被拦住了。请手动复制下面的地址，粘到浏览器地址栏打开。');
  });
}
function doExport(){
  if(!S.score){ alert('先生成一条练习曲'); return; }
  let html;
  try{
    html = buildExportHTML(S.score);
  }catch(err){
    alert('导出失败：' + err.message);
    return;
  }
  const name = exportFilename(S.score);
  const blob = new Blob([html], {type:'text/html;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = name;
  a.rel = 'noopener';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 8000);
  if(inFrame()) showExportHint(name);
}

document.getElementById('panel').addEventListener('click', function(e){
  const b = e.target.closest('.pill');
  if(!b) return;
  const k = b.dataset.k;
  let v = b.dataset.v;
  if(k === 'level' || k === 'measures' || k === 'voices') v = +v;
  S[k] = v;
  /* 学段换了以后，原来的难度可能已经超上限，往下收 */
  if(k === 'stage'){
    const cap = R.MAX_LEVEL_BY_STAGE[S.stage];
    if(cap !== undefined && S.level > cap) S.level = cap;
  }
  buildPanel();
  generate();          // 参数一改就重出，老师不用再点一次「生成」
});
document.getElementById('btnGen').addEventListener('click', function(){ generate(); });
document.getElementById('btnAnother').addEventListener('click', function(){ generate(); });

/* 给验证脚本留的句柄（和上面 window.PLAYER 同一个理由，不是给老师用的入口）。
   e2e 必须可复现：同一组参数下每次随机种子都不同，这一趟可能抽到的全是四分音符、
   下一趟才有十六分音符，覆盖面就成了碰运气——测试会时绿时红，还不如没有。
   有 generate(seed) 才能把「这一趟到底验了什么」钉死。 */
window.PG = { generate: generate, state: S };

buildPanel();
generate();
})();
