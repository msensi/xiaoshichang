one-fold%29%22%20d%3D%22M263%20527%20287%20516C321%20499%20354%20519%20369%20551%20373%20559%20376%20567%20376%20576V715C376%20747%20351%20772%20319%20772%20287%20772%20263%20747%20263%20716Z%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%0A%20%20%3Cg%20id%3D%22xs-number-2%22%3E%0A%20%20%20%20%3Cpath%20id%3D%22xs-digit-2%22%20fill%3D%22url%28%23xs-paper%29%22%20d%3D%22M430%20500C443%20437%20508%20391%20585%20391%20671%20391%20730%20443%20730%20513%20730%20579%20683%20618%20608%20673H711C738%20673%20760%20694%20760%20720%20760%20747%20739%20767%20712%20767H488C460%20767%20440%20747%20440%20720%20440%20696%20452%20678%20473%20657L583%20572C617%20546%20635%20528%20635%20512%20635%20493%20615%20482%20586%20482%20557%20482%20536%20495%20522%20522%20512%20540%20492%20548%20474%20548%20445%20548%20424%20528%20430%20500Z%22%2F%3E%0A%20%20%20%20%3Cpath%20id%3D%22xs-digit-2-fold%22%20fill%3D%22url%28%23xs-two-fold%29%22%20d%3D%22M635%20515C631%20547%20608%20574%20576%20601%20544%20629%20526%20648%20527%20658%20528%20669%20537%20673%20551%20673H608L674%20623C649%20596%20637%20560%20635%20515Z%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%0A%20%20%3Cg%20id%3D%22xs-number-3%22%3E%0A%20%20%20%20%3Cpath%20id%3D%22xs-digit-3%22%20fill%3D%22url%28%23xs-paper%29%22%20d%3D%22M865%20396H968C1035%20396%201082%20435%201082%20492%201082%20531%201066%20557%201043%20578%201077%20596%201097%20624%201097%20661%201097%20731%201036%20773%20943%20773%20876%20773%20820%20751%20801%20716%20788%20695%20795%20670%20812%20657%20829%20643%20849%20648%20869%20660%20897%20679%20920%20689%20946%20689%20979%20689%201001%20673%201001%20649%201001%20624%20982%20623%20951%20623H908C882%20623%20863%20601%20863%20574%20863%20547%20882%20535%20908%20535H936C966%20535%20984%20523%20989%20498H865C835%20498%20814%20477%20814%20449%20814%20420%20836%20396%20865%20396Z%22%2F%3E%0A%20%20%20%20%3Cpath%20id%3D%22xs-digit-3-upper-fold%22%20fill%3D%22url%28%23xs-three-upper-fold%29%22%20d%3D%22M989%20498C1023%20497%201046%20515%201051%20541%201054%20555%201048%20567%201043%20578%201015%20560%20978%20546%20936%20535%20967%20534%20984%20520%20989%20498Z%22%2F%3E%0A%20%20%20%20%3Cpath%20id%3D%22xs-digit-3-lower-fold%22%20fill%3D%22url%28%23xs-three-lower-fold%29%22%20d%3D%22M997%20638C1008%20678%20996%20718%20963%20746%20945%20762%20923%20772%20901%20772%20926%20750%20941%20721%20946%20689%20977%20689%20996%20673%20997%20638Z%22%2F%3E%0A%20%20%3C%2Fg%3E%0A%0A%20%20%3Cg%20id%3D%22xs-eighth-note-bar%22%3E%0A%20%20%20%20%3Crect%20id%3D%22xs-bar%22%20x%3D%22157%22%20y%3D%22807%22%20width%3D%22935%22%20height%3D%22100%22%20rx%3D%2250%22%20fill%3D%22url%28%23xs-bar-fill%29%22%2F%3E%0A%20%20%3C%2Fg%3E%3C%2Fsvg%3E">
<style>
/* 色板与结果页（离线导出页）**同一套**。两页本来就是同一个产品的两个面：
   一页参数、一页谱面，配色/圆角/阴影分成两套只会显得像两个产品。
   这里以结果页为准（那个页面的配色和屏幕适配已经定稿），生成页向它对齐。
   --accent / --accent-soft 是生成页自己用的"主色"别名，直接指向结果页的声部一蓝，
   不再自成一个蓝——两页的蓝不一样是最容易被一眼看出来的破绽。 */
:root{
  --bg:#eef1f5; --card:#fff; --ink:#1b2430; --ink2:#3d4855; --muted:#7a8695;
  --line:#d9dfe7; --line-soft:#e9edf2;
  --p1:#2563eb; --p2:#d97706; --ok:#0f766e;
  --accent:#2563eb; --accent-soft:#eaf1fc; --warn:#b91c1c;
  --shadow:0 1px 2px rgba(20,30,45,.06), 0 10px 28px rgba(20,30,45,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
     font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",Arial,sans-serif}

/* ---------- 产品页骨架 ---------- */
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:20px 18px 96px;
      position:relative}
.brand .lockup{display:flex;align-items:center;gap:9px;margin-bottom:3px}
.brand .mark{flex:0 0 auto;display:block}
.brand h1{margin:0;font-size:19px;font-weight:600;letter-spacing:.01em}
.brand .tagline{font-size:12px;color:var(--muted);margin-bottom:9px;letter-spacing:.01em}
.brand p{margin:0 0 18px;color:var(--muted);font-size:12.5px;line-height:1.55}
.fld{margin-bottom:15px}
.fld>label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;
           font-weight:600;letter-spacing:.02em}
.pills{display:flex;flex-wrap:wrap;gap:6px}
/* 药丸按钮对齐结果页的 .chk / .btn：9px 圆角、同样的边框色与悬停底色。
   选中态用结果页勾选框选中时的淡蓝底 + 蓝边 + 蓝字。 */
.pill{border:1px solid var(--line);background:#fff;border-radius:9px;
      padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink2);
      font-family:inherit;transition:background .13s,border-color .13s,color .13s}
.pill:hover{background:#f4f7fb;border-color:#c3cddb}
.pill.on{background:#f2f6ff;border-color:#cdddff;color:var(--p1)}
.pill:disabled{opacity:.4;cursor:not-allowed}
.sidefoot{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 18px;
          background:#fff;border-top:1px solid var(--line-soft)}
.btn{font-family:inherit;font-size:12.5px;font-weight:600;border-radius:9px;cursor:pointer;
     height:40px;padding:0 14px;border:1px solid var(--line);background:#fff;color:var(--ink2);
     transition:background .13s,border-color .13s}
.btn:hover{background:#f4f7fb;border-color:#c3cddb}
/* 主按钮照抄结果页的「播放」按钮：深色实心 + 同一道阴影。
   主操作在两个页面上长得一样，是"同一个产品"最直接的信号。 */
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;
             height:44px;border-radius:11px;font-size:15px;font-weight:650;letter-spacing:.03em;
             box-shadow:0 6px 16px rgba(27,36,48,.22)}
.btn.primary:hover{background:#243040;border-color:#243040}
.btn:disabled{opacity:.5;cursor:default}
.sidefoot .btn{width:100%}
.sidefoot .btn+.btn{margin-top:8px}

/* ---------- 主区 ---------- */
.main{padding:18px 20px 40px;min-width:0}
.topbar{margin-bottom:12px;display:flex;align-items:flex-end;justify-content:space-between;
        gap:12px;flex-wrap:wrap}
.topbar .t{font-size:20px;font-weight:650;line-height:1.25;letter-spacing:.01em}
.topbar .l{font-size:12.5px;color:var(--muted);margin-top:5px}
/* 离线可用标：和结果页页头那个同款 */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
       color:var(--ok,#0f766e);background:#e6f4f1;border:1px solid #c4e4de;
       border-radius:999px;padding:3px 9px;white-space:nowrap}
.badge i{width:6px;height:6px;border-radius:50%;background:#0f766e;display:block}
/* 谱面卡片：与结果页 .card 同款（14px 圆角 + 同一道阴影） */
.sheet{background:var(--card);border:1px solid var(--line);border-radius:14px;
       box-shadow:var(--shadow);padding:14px 16px;min-height:150px;overflow-x:auto}
.empty{color:var(--muted);font-size:14px;padding:34px 0;text-align:center}
.msg{color:var(--warn);font-size:14px;padding:22px 0;text-align:center}

.row{display:flex;align-items:flex-start;gap:12px;padding:8px 0}
.row+.row{border-top:1px dashed var(--line-soft)}
.vname{width:56px;flex:none;font-size:12px;font-weight:700;letter-spacing:.03em;
       padding-top:15px;display:flex;align-items:center;gap:5px;white-space:nowrap}
/* 声部名前面那道小色条，和结果页 .lab::before 同款 */
.vname::before{content:"";width:3px;height:14px;border-radius:2px;
               background:currentColor;opacity:.85;flex:0 0 auto}
.vname.p1{color:var(--p1)} .vname.p2{color:var(--p2)}
.staff{display:flex;flex-wrap:wrap;align-items:flex-start;
       font-family:"Courier New",monospace}
.m{display:flex;align-items:flex-start;justify-content:flex-start;
   padding:3px 11px;border-left:1px solid var(--line);border-radius:4px;min-height:60px;
   transition:background .1s}
.m:first-child{border-left:0;padding-left:2px}
.m.cur{background:var(--accent-soft)}
/* 小节内按"第几拍"占位：槽位从 0 起算，空档按时值（flex-grow 写在元素上）分，
   于是每拍等宽、只有一个音的小节落在第 1 拍上。和结果页 .meas > * 同一套规则。
   min-width 保持默认 auto（内容宽），密到装不下时以内容宽兜底，不让音符重叠。 */
.m > *{flex-shrink:0;flex-basis:0}
/* 一条横梁 = 拍内的短音符。左右留 4px：横梁按"拍"分组，两组之间必须看得出断开，
   否则前后两组贴成一条长线，分组就白做了（组内不受影响——线画在音符盒子上、盒子相邻就接上） */
.bm{display:inline-flex;gap:0;margin:0 4px}
.n{display:inline-flex;flex-direction:column;align-items:flex-start;padding:0 5px;
   position:relative}
.n .top{height:12px}
.n .mid{font-size:22px;line-height:22px;white-space:nowrap}
.n .mid .dg{display:inline-block;position:relative}
/* 八度点画成 4.5px 实心圆，贴在数字正上/正下方。
   以前这里是 '·' 字符（10px 字号），那个点只有一两个像素，
   看上去就是"高音 1 上面没有点"。结果页用的是实心圆，现在两边同一种画法。 */
.n .dg .oct{position:absolute;left:50%;top:-9px;transform:translateX(-50%);
            width:4.5px;height:4.5px;border-radius:50%;background:currentColor}
.n .dg .oct.low{top:auto;bottom:-9px}
/* 下划线画在 .n 的整个盒子上（含左右 padding），不画在数字盒上：
   组内 gap:0，相邻两条线才能接成一条横梁。
   以前画在数字盒上、音符之间又有 5px padding，相邻八分下面成了两截短线、中间空 10px。 */
/* 横梁线：**两端不要圆角**。线是逐音符画的、盒子相邻就接上，带圆角时每个接缝会露出
   一个"关节"，放大看像随手画的；方头对接才是一条连续的直线。（用户 2026-09-29 指出） */
.n.l1::after,.n.l2::after{content:'';position:absolute;left:0;right:0;bottom:15px;
                          height:1.6px;background:currentColor}
.n.l2::before{content:'';position:absolute;left:0;right:0;bottom:10px;
              height:1.6px;background:currentColor}
.n .bot{height:15px}
.n .mid .dot{font-size:13px;vertical-align:-2px}
.dash{opacity:.5;letter-spacing:-1px}

/* ---------- 播放条 ---------- */
/* 与结果页的工具栏卡片同款：白底、14px 圆角、同一道阴影、9~11px 圆角的按钮 */
.transport{display:none;align-items:center;gap:10px;flex-wrap:wrap;
           background:var(--card);border:1px solid var(--line);border-radius:14px;
           box-shadow:var(--shadow);padding:12px 16px;margin-top:12px}
.transport.ready{display:flex}
.tp{font-family:inherit;font-size:12.5px;font-weight:600;border-radius:9px;cursor:pointer;
    height:34px;padding:0 13px;border:1px solid var(--line);background:#fff;color:var(--ink2);
    transition:background .13s,border-color .13s}
.tp:hover{background:#f4f7fb;border-color:#c3cddb}
/* 播放键 = 结果页那个深色实心「播放」按钮 */
.tp.primary{background:var(--ink);border-color:var(--ink);color:#fff;
            box-shadow:0 6px 16px rgba(27,36,48,.22)}
.tp.primary:hover{background:#243040;border-color:#243040}
.tog{display:flex;gap:6px}
/* 两个声部按钮的选中色 = 结果页那两个勾选框的选中色（蓝 / 琥珀） */
.tog .pill.v1.on{background:#f2f6ff;border-color:#cdddff;color:var(--p1)}
.tog .pill.v2.on{background:#fff7ec;border-color:#f4dcbb;color:#b45309}
.grow{flex:1}
.spd{font-size:12.5px;color:var(--muted)}
.spd b{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.rng{width:132px;accent-color:var(--accent)}.sep{width:1px;height:20px;background:var(--line)}

/* ---------- 导出提示（只在"点了没下载成"时出现）---------- */
.exphint{margin-top:10px;padding:11px 14px;border:1px solid #f0d9a8;background:#fffaf0;
         border-radius:10px;font-size:13px;color:#7a5a12;line-height:1.65}
.exphint b{color:#5c430b}
.exphint .acts{margin-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.exphint input{font-family:inherit;font-size:12px;padding:5px 8px;border-radius:6px;
               border:1px solid #e6d3ae;background:#fff;color:#5c430b;width:min(420px,100%)}

/* ---------- 使用说明 ----------
   这里原来放的是引擎的诊断信息（重掷次数、风格约束放宽等级、报告条目）。
   那些东西是给我自己看的，老师看不懂——"这一条重掷过 26 次才达标"对她没有任何指导意义。
   换成一段真的有用的说明：预览和导出的区别，以及这个页面上几个能用的动作。 */
.usage{margin-top:12px;padding:12px 15px;border:1px solid #cfe0f8;background:#f5f9ff;
       border-radius:12px;font-size:13px;color:#274268;line-height:1.7}
.usage b{color:#17335c}
.usage .acts{margin-top:7px;display:flex;flex-wrap:wrap;gap:6px 16px;
             font-size:12.5px;color:#3c5a86}
.usage .acts span::before{content:"·";margin-right:7px;color:#9db8dd;font-weight:700}

/* ---------- 页脚 ---------- */
.pagefoot{margin-top:18px;padding-top:10px;border-top:1px solid var(--line);
          font-size:11.5px;color:var(--muted);line-height:1.7}

/* ---------- 导出页 ---------- */
.doc{max-width:1000px;margin:0 auto;padding:26px 22px 60px}
.doc h2{margin:0 0 4px;font-size:19px}
.doc .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.doc .foot{margin-top:22px;color:var(--muted);font-size:12.5px;line-height:1.7}
@media print{
  .transport,.foot{display:none!important}
  body{background:#fff}
  .sheet{border:0;padding:0}
  .m.cur{background:none}
}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--line);position:static;padding-bottom:18px}
  .sidefoot{position:static;background:none;padding:14px 0 0}
}
</style>
</head>

  relaxedAt = relaxedAt || {};
  var msgs = [], n = notes.length;
  for (var i = 1; i < n; i++) {
    var iv = Math.abs(notes[i].midi - notes[i - 1].midi);
    if (INTERVAL_CADENCE_ONLY[iv]) {
      if (!octaveAtPhraseEnd[i]) msgs.push(tag + '第 ' + (i + 1) + ' 音出现纯八度跳进，但不在句尾');
      continue;
    }
    if (!INTERVAL_OK[iv]) {
      msgs.push(tag + '第 ' + (i + 1) + ' 音程 ' + iv + ' 半音不在白名单（禁增四/小七/大七）');
    } else if (iv > maxInterval && !relaxedAt[i]) {
      msgs.push(tag + '第 ' + (i + 1) + ' 音程 ' + iv + ' 半音，超过上限 ' + maxInterval);
    }
  }
  return msgs;
}

function vLeapRecovery(notes, tag) {
  var msgs = [];
  for (var i = 1; i < notes.length - 1; i++) {
    var d1 = notes[i].midi - notes[i - 1].midi;
    if (Math.abs(d1) < BIG_LEAP) continue;
    var d2 = notes[i + 1].midi - notes[i].midi;
    if (Math.abs(d2) > STEP || (d2 !== 0 && (d2 > 0) === (d1 > 0))) {
      msgs.push(tag + '第 ' + i + ' 音大跳 ' + Math.abs(d1) + ' 半音后没有反向级进回落');
    }
  }
  return msgs;
}

function vStepRatio(notes, need, tag) {
  var ivs = [];
  for (var i = 1; i < notes.length; i++) ivs.push(Math.abs(notes[i].midi - notes[i - 1].midi));
  ivs = ivs.filter(function (x) { return x !== 0; });
  if (!ivs.length) return [];
  var ratio = ivs.filter(function (x) { return x <= STEP; }).length / ivs.length;
  return ratio < need - 1e-9
    ? [tag + '级进占比 ' + pct(ratio) + '，低于要求的 ' + pct(need)] : [];
}

function vRepeatRatio(notes, maxRepeat, tag) {
  if (notes.length < 3) return [];
  var ivs = [];
  for (var i = 1; i < notes.length; i++) ivs.push(Math.abs(notes[i].midi - notes[i - 1].midi));
  var ratio = ivs.filter(function (x) { return x === 0; }).length / ivs.length;
  return ratio > maxRepeat
    ? [tag + '同音反复占 ' + pct(ratio) + '，超过上限 ' + pct(maxRepeat)] : [];
}

function vLeapCount(notes, need, sizes, tag) {
  var got = 0;
  for (var i = 1; i < notes.length; i++) {
    if (sizes[Math.abs(notes[i].midi - notes[i - 1].midi)]) got++;
  }
  return got < need
    ? [tag + '符合要求的跳进只有 ' + got + ' 处，少于要求的 ' + need + ' 处'] : [];
}

function vArch(phraseNotes, tonicPc, peakAt, tag) {
  if (phraseNotes.length < 3) return [];
  var msgs = [], top = 0;
  for (var i = 1; i < phraseNotes.length; i++) {
    if (phraseNotes[i].midi > phraseNotes[top].midi) top = i;
  }
  var pos = top / (phraseNotes.length - 1);
  if (!(peakAt - 0.20 <= pos && pos <= 0.88)) {
    msgs.push(tag + '峰值落在乐句 ' + pct(pos) + ' 处，不在拱形区间（' + pct(peakAt - 0.20) + '–88%）');
  }
  var dg = degreeOf(phraseNotes[top].midi, tonicPc);
  if (dg !== 1 && dg !== 3 && dg !== 5) {
    msgs.push(tag + '峰值不是主和弦音（第 ' + dg + ' 级）');
  }
  return msgs;
}

function vPhraseEndings(measures, phraseLen, tonicPc, tag, onlyFinal) {
  var msgs = [], groups = [];
  for (var i = 0; i < measures.length; i += phraseLen) groups.push(i);
  groups.forEach(function (pi, k) {
    var group = measures.slice(pi, pi + phraseLen);
    if (!group.length || !group[group.length - 1].length) return;
    var isFinal = (k === groups.length - 1);
    if (onlyFinal && !isFinal) return;
    var lastM = group[group.length - 1];
    var deg = degreeOf(lastM[lastM.length - 1].midi, tonicPc);
    var need = isFinal ? [1] : RULES.STABLE_DEGREES;
    if (need.indexOf(deg) < 0) {
      var want = isFinal ? '主音（第 1 级）' : '主音或属音';
      msgs.push(tag + '第 ' + (k + 1) + ' 句末音落在第 ' + deg + ' 级，应收在' + want);
    }
  });
  return msgs;
}

function vParallel(hi, lo, tag) {
  tag = tag || '';
  var msgs = [], n = Math.min(hi.length, lo.length);
  for (var i = 1; i < n; i++) {
    var a0 = hi[i - 1].midi, b0 = lo[i - 1].midi, a1 = hi[i].midi, b1 = lo[i].midi;
    if (!PERFECT_INTERVALS[Math.abs(a0 - b0) % 12] ||
        !PERFECT_INTERVALS[Math.abs(a1 - b1) % 12]) continue;
    var hd = a1 - a0, ld = b1 - b0;
    if (hd === 0 || ld === 0) continue;
    if ((hd > 0) === (ld > 0)) {
      var kind = Math.abs(hd) === Math.abs(ld) ? '平行' : '隐伏';
      msgs.push(tag + '第 ' + (i + 1) + ' 个位置出现' + kind + '五/八度');
    }
  }
  return msgs;
}

function vCrossing(hi, lo, tag, allowEqual) {
  tag = tag || ''; allowEqual = allowEqual || {};
  var msgs = [], n = Math.min(hi.length, lo.length);
  for (var i = 0; i < n; i++) {
    var a = hi[i].midi, b = lo[i].midi;
    if (a < b) msgs.push(tag + '第 ' + (i + 1) + ' 个位置声部交叉（高 ' + a + ' < 低 ' + b + '）');
    else if (a === b && !allowEqual[i]) msgs.push(tag + '第 ' + (i + 1) + ' 个位置意外同度（非句尾）');
  }
  return msgs;
}

function vSpacing(hi, lo, maxSpacing, tag) {
  tag = tag || '';
  var msgs = [], n = Math.min(hi.length, lo.length);
  for (var i = 0; i < n; i++) {
    var gap = hi[i].midi - lo[i].midi;
    if (gap > maxSpacing) {
      msgs.push(tag + '第 ' + (i + 1) + ' 个位置声部间距 ' + gap + ' 半音，超过上限 ' + maxSpacing);
    }
  }
  return msgs;
}

function vVertical(hi, lo, tag) {
  tag = tag || '';
  var okSet = { 0: 1, 3: 1, 4: 1, 7: 1, 8: 1, 9: 1 };
  var name = { 1: '小二/大七', 2: '大二/小七', 5: '纯四度', 6: '增四度', 10: '小七', 11: '大七' };
  var msgs = [], n = Math.min(hi.length, lo.length);
  for (var i = 0; i < n; i++) {
    var vid = pmod(hi[i].midi - lo[i].midi, 12);
    if (!okSet[vid]) {
      msgs.push(tag + '第 ' + (i + 1) + ' 个位置纵向音程是' + (name[vid] || vid) +
                '（' + vid + ' 半音），不协和');
    }
  }
  return msgs;
}

/* ============================================================
 * 4. 节奏
 * ============================================================ */

function composeMeasure(beats, durs, rng, minNotes, tail) {
  if (minNotes === undefined) minNotes = 2;
  if (tail === undefined) tail = null;
  var out = [], remain = beats;
  if (tail !== null && tail <= remain + 1e-6) {
    out.push(tail);
    remain = round6(remain - tail);
  }
  var guard = 0;
  while (remain > 1e-6 && guard < 64) {
    guard++;
    var need = minNotes - out.length - 1;
    var cand = durs.filter(function (d) { return d <= remain + 1e-6; });
    if (need > 0) {
      var short = cand.filter(function (d) { return remain - d > 1e-6; });
      if (short.length) cand = short;
    }
    if (!cand.length) cand = [Math.min.apply(null, durs)];
    var d = rng.choices(cand, cand)[0];
    out.push(d);
    remain = round6(remain - d);
  }
  rng.shuffle(out);
  if (tail !== null && out.length && out[out.length - 1] !== tail &&
      out.indexOf(tail) >= 0) {
    out.splice(out.indexOf(tail), 1);
    out.push(tail);
  }
  return out;
}

function buildRhythm(meter, nMeasures, level, phraseLen, rng) {
  var beats = meter[0], durs = level.durs, measures = [];
  for (var mi = 0; mi < nMeasures; mi++) {
    var tail = null;
    if ((mi + 1) % phraseLen === 0) {
      var ok = durs.filter(function (d) { return d <= beats + 1e-6; });
      tail = ok.length ? Math.max.apply(null, ok) : beats;
    }
    measures.push(composeMeasure(beats, durs, rng, 2, tail));
  }
  return measures;
}

/* ============================================================
 * 5. 目标音高曲线
 * ============================================================ */

function buildPhraseTarget(goal, n, lo, hi, rng, idx) {
  if (idx === undefined) idx = 0;
  var g = RULES.GOALS[goal], span = hi - lo, i, out = [], cur;
  if (g.arch) {
    var peak = g.peak_at;
    for (i = 0; i < n; i++) {
      var t = i / Math.max(1, n - 1);
      var f = t <= peak ? t / peak : (1 - t) / (1 - peak);
      out.push(lo + span * (0.18 + 0.64 * f));
    }
    return out;
  }
  if (goal === 'scale') {
    var asc = (idx % 2 === 0);
    if (rng.random() < 0.3) asc = !asc;
    var a = rng.uniform(0.04, 0.28), b = rng.uniform(0.58, 0.96);
    if (!asc) { var tmp = a; a = b; b = tmp; }
    for (i = 0; i < n; i++) out.push(lo + span * (a + (b - a) * i / Math.max(1, n - 1)));
    return out;
  }
  if (goal === 'rhythm') {
    cur = rng.uniform(0.22, 0.5);
    for (i = 0; i < n; i++) {
      cur = Math.min(0.78, Math.max(0.08, cur + rng.uniform(-0.11, 0.11)));
      out.push(lo + span * cur);
    }
    return out;
  }
  cur = rng.uniform(0.24, 0.62);
  for (i = 0; i < n; i++) {
    cur = Math.min(0.9, Math.max(0.08, cur + rng.uniform(-0.14, 0.14)));
    out.push(lo + span * cur);
  }
  return out;
}

/* ============================================================
 * 6. 生成
 * ============================================================ */

function planLeaps(goal, phraseLens, rng, gap) {
  if (gap === undefined) gap = 2;
  var need = RULES.GOALS[goal].leaps_per_phrase || 0;
  if (!need) return {};
  var pos = {}, base = 0;
  phraseLens.forEach(function (ln) {
    var body = [];
    for (var i = base + 1; i < base + ln - 2; i++) body.push(i);
    rng.shuffle(body);
    var chosen = [];
    for (var k = 0; k < body.length; k++) {
      var ok = true;
      for (var c = 0; c < chosen.length; c++) {
        if (Math.abs(body[k] - chosen[c]) < gap) { ok = false; break; }
      }
      if (ok) chosen.push(body[k]);
      if (chosen.length >= need) break;
    }
    chosen.forEach(function (x) { pos[x] = true; });
    base += ln;
  });
  return pos;
}

function genVoice(goal, level, meter, nMeasures, tonicPc, lo, hi, rng, tag, lowerPool) {
  tag = tag || ''; lowerPool = lowerPool || null;
  var beats = meter[0], g = RULES.GOALS[goal];
  var phraseLen = level.phrase_len;
  if (nMeasures % phraseLen) phraseLen = (nMeasures % 2 === 0) ? 2 : nMeasures;

  var rhythm = buildRhythm(meter, nMeasures, level, phraseLen, rng);
  var flat = [];
  rhythm.forEach(function (m) { m.forEach(function (d) { flat.push(d); }); });
  var n = flat.length, i, k;

  var mIdx = [];
  rhythm.forEach(function (m, mi) { for (var t = 0; t < m.length; t++) mIdx.push(mi); });

  var onBeat = [];
  for (i = 0; i < mIdx.length; i++) onBeat.push(i === 0 || mIdx[i - 1] !== mIdx[i]);

  var isPlast = [];
  for (i = 0; i < mIdx.length; i++) {
    var mi2 = mIdx[i];
    var lastInM = (i === n - 1) || (mIdx[i + 1] !== mi2);
    isPlast.push(lastInM && (mi2 % phraseLen === phraseLen - 1));
  }

  var phraseOf = mIdx.map(function (x) { return Math.floor(x / phraseLen); });
  var nPhrases = phraseOf[phraseOf.length - 1] + 1;
  var phraseLens = [];
  for (var p = 0; p < nPhrases; p++) {
    phraseLens.push(phraseOf.filter(function (x) { return x === p; }).length);
  }
  var phraseStart = {};
  for (i = 0; i < phraseOf.length; i++) {
    if (!(phraseOf[i] in phraseStart)) phraseStart[phraseOf[i]] = i;
  }

  /* 终止式：中间句收属音或主音，最后一句必须回主音 */
  var endDeg = [], tailTonicOnly = [];
  for (i = 0; i < n; i++) {
    if (!isPlast[i]) { endDeg.push(null); tailTonicOnly.push(false); }
    else if (phraseOf[i] === nPhrases - 1) { endDeg.push({ 1: true }); tailTonicOnly.push(true); }
    else { endDeg.push(STABLE_DEGREES); tailTonicOnly.push(false); }
  }

  var poolFull = diatonic(lo, hi, tonicPc);
  var pool = (g.narrow_pool === 'triad') ? chordTones(1, tonicPc, lo, hi) : poolFull;
  if (pool.length < 3) pool = poolFull;
  var maxIv = Math.min(level.max_interval, (g.max_interval === undefined ? 99 : g.max_interval));
  var needLeaps = g.leaps_per_phrase || 0;
  var leapSizes = {};
  (g.leap_sizes || []).forEach(function (v) { leapSizes[v] = true; });
  var leapPos = planLeaps(goal, phraseLens, rng);

  var targets = [];
  for (var pi = 0; pi < phraseLens.length; pi++) {
    targets.push(buildPhraseTarget(goal, phraseLens[pi], lo, hi, rng, pi));
  }

  function reachable(p, allowedDeg) {
    for (var q = 0; q < poolFull.length; q++) {
      var cand = poolFull[q];
      if (!allowedDeg[degreeOf(cand, tonicPc)]) continue;
      var iv = Math.abs(cand - p);
      if (iv === 0 || (INTERVAL_OK[iv] && iv <= maxIv) || INTERVAL_CADENCE_ONLY[iv]) return true;
    }
    return false;
  }

  /* 句末前一个音必须留出通往终止音的路。
     注意：Python 里空集合是假值，会跳过这条检查；JS 里空对象是真值。
     所以这里只在集合非空时才写入 preOk，保持与 Python 的判断一致。 */
  var preOk = {};
  for (i = 0; i < n - 1; i++) {
    if (endDeg[i + 1] !== null) {
      var s = {}, cnt = 0;
      poolFull.forEach(function (p) { if (reachable(p, endDeg[i + 1])) { s[p] = true; cnt++; } });
      if (cnt) preOk[i] = s;
    }
  }

  function hardOk(p, i, prev, prevD) {
    if (prev === null || prev === undefined) return true;
    var iv = Math.abs(p - prev), d = p - prev;
    var recovery = Math.abs(prevD) >= BIG_LEAP;
    if (recovery) {
      if (iv > STEP || (d !== 0 && (d > 0) === (prevD > 0))) return false;
    } else {
      if (INTERVAL_CADENCE_ONLY[iv]) {
        if (!isPlast[i]) return false;
      } else if (!INTERVAL_OK[iv] || iv > maxIv) return false;
      if (leapPos[i] && !leapSizes[iv]) return false;
    }
    if (endDeg[i] !== null && !endDeg[i][degreeOf(p, tonicPc)]) return false;
    if (preOk[i] && !preOk[i][p]) return false;
    if (lowerPool !== null) {
      var q = thirdBelow(p, tonicPc);
      if (!lowerPool[q]) return false;
      if (prev !== null && prev !== undefined) {
        var iv2 = Math.abs(q - thirdBelow(prev, tonicPc));
        if (iv2 && (!INTERVAL_OK[iv2] || iv2 > maxIv)) return false;
      }
    }
    return true;
  }

  function softCheck(notes, measures, tier) {
    var msgs = [];
    if (tier === 0) {
      msgs = msgs.concat(vRepeatRatio(notes, 0.35, tag));
      if (g.step_ratio) msgs = msgs.concat(vStepRatio(notes, g.step_ratio, tag));
      if (g.arch) {
        var p0 = 0;
        phraseLens.forEach(function (ln, qi) {
          msgs = msgs.concat(vArch(notes.slice(p0, p0 + ln), tonicPc, g.peak_at,
                                   tag + '第' + (qi + 1) + '句 '));
          p0 += ln;
        });
      }
      if (needLeaps) msgs = msgs.concat(vLeapCount(notes, needLeaps * nPhrases, leapSizes, tag));
    } else if (tier === 1) {
      msgs = msgs.concat(vRepeatRatio(notes, 0.5, tag));
      if (g.step_ratio) msgs = msgs.concat(vStepRatio(notes, g.step_ratio * 0.7, tag));
      if (needLeaps) msgs = msgs.concat(vLeapCount(notes, Math.max(1, nPhrases), leapSizes, tag));
    }
    return msgs;
  }

  var last = null;
  for (var attempt = 0; attempt < MAX_RETRY; attempt++) {
    var notes = [], prev = null, prevD = 0;
    for (i = 0; i < n; i++) {
      var pIdx = phraseOf[i];
      var tgt = targets[pIdx][i - phraseStart[pIdx]];
      var cands = poolFull.filter(function (p) { return hardOk(p, i, prev, prevD); });
      if (!cands.length) cands = (prev !== null) ? [prev] : [poolFull[Math.floor(poolFull.length / 2)]];
      if (goal === 'rhythm') {
        var tri = cands.filter(function (p) { return pool.indexOf(p) >= 0; });
        if (tri.length) cands = tri;
      }
      var weights = cands.map(function (p) {
        var ww = 1.0 / (1.0 + Math.abs(p - tgt) * 0.85);
        if (prev !== null) {
          var iv = Math.abs(p - prev);
          if (iv <= STEP) ww *= g.step_ratio ? 2.2 : 1.4;
          if (iv === 0) ww *= 0.3;
          else if (prevD !== 0 && (p - prev) !== 0 && ((p - prev) > 0) === (prevD > 0)) {
            ww *= (g.momentum === undefined ? 1.0 : g.momentum);
          }
          if (leapPos[i] && leapSizes[iv]) ww *= 5.0;
        }
        if (onBeat[i]) ww *= 1.15;
        if (g.arch) {
          var ln2 = phraseLens[pIdx];
          var rel = (i - phraseStart[pIdx]) / Math.max(1, ln2 - 1);
          var dg2 = degreeOf(p, tonicPc);
          if (Math.abs(rel - g.peak_at) < 0.18 && (dg2 === 1 || dg2 === 3 || dg2 === 5)) ww *= 1.7;
        }
        if (tailTonicOnly[i] && p === lo) ww *= 2.0;
        return Math.max(ww, 1e-6);
      });
      var picked = rng.choices(cands, weights)[0];
      prevD = (prev === null) ? 0 : picked - prev;
      prev = picked;
      notes.push({ beat: 0.0, dur: flat[i], midi: picked });
    }

    var t = 0.0, measures = [], idx = 0;
    rhythm.forEach(function (m) {
      var grp = [];
      for (var q = 0; q < m.length; q++) {
        notes[idx].beat = round6(t);
        t = round6(t + notes[idx].dur);
        grp.push(notes[idx]);
        idx++;
      }
      measures.push(grp);
    });

    var hard = [];
    hard = hard.concat(vRange(notes, lo, hi, tag));
    hard = hard.concat(vMeter(measures, beats, tag));
    var octEnd = {};
    for (i = 0; i < n; i++) if (isPlast[i]) octEnd[i] = true;
    hard = hard.concat(vIntervals(notes, maxIv, tag, octEnd, {}));
    hard = hard.concat(vLeapRecovery(notes, tag));
    hard = hard.concat(vPhraseEndings(measures, phraseLen, tonicPc, tag));
    if (hard.length) continue;
    last = [notes, measures];

    if (!softCheck(notes, measures, 0).length) return [notes, measures, 0, attempt + 1];
    if (attempt >= MAX_RETRY * 0.6 && !softCheck(notes, measures, 1).length) {
      return [notes, measures, 1, attempt + 1];
    }
  }
  if (last) return [last[0], last[1], 2, MAX_RETRY];
  return [null, null, 3, MAX_RETRY];
}

function deriveParallel(topNotes, pool, maxIv, tonicPc, chordAt, chordDeg) {
  if (chordAt === undefined) chordAt = null;
  if (chordDeg === undefined) chordDeg = [1, 3, 5];
  var poolSet = {};
  pool.forEach(function (v) { poolSet[v] = true; });
  var poolArr = pool.slice();
  var rank = { 0: 0, 8: 1, 9: 1, 3: 2, 4: 2, 7: 3 };
  var out = [];

  for (var i = 0; i < topNotes.length; i++) {
    var note = topNotes[i];
    var p = note.midi;
    var prevLow = out.length ? out[out.length - 1].midi : null;
    var pick = null;

    if (chordAt !== null && i === chordAt) {
      for (var mode = 0; mode < 3; mode++) {
        var cands = [];
        for (var qi = 0; qi < poolArr.length; qi++) {
          var q = poolArr[qi];
          if (q > p) continue;
          if (chordDeg.indexOf(degreeOf(q, tonicPc)) < 0) continue;
          var vid = pmod(p - q, 12);
          if (!(vid in rank)) continue;
          if (prevLow !== null) {
            var iv = Math.abs(q - prevLow);
            if (mode === 0 && (!INTERVAL_OK[iv] || iv === 0)) continue;
            if (mode === 1 && !INTERVAL_OK[iv]) continue;
          }
          /* 末音要落在八度上（用户 2026-09-28 定）。
             同度和八度在 vid 上都是 0（八度差 12，12 % 12 == 0），光看 rank 分不开，
             所以加一个"是不是正好一个整八度"当第二排序键，让八度排在同度前面。
             八度够不到时（低声部音域下不去）才退回同度、再退回六度。 */
          var octPref = (pmod(p - q, 12) === 0 && p !== q) ? 0 : 1;
          cands.push([rank[vid], octPref, Math.abs(p - q), q]);
        }
        if (cands.length) {
          /* 全序排序（rank, 是否整八度, 距离, 音高），因此结果与集合遍历顺序无关 */
          cands.sort(function (A, B) {
            return A[0] - B[0] || A[1] - B[1] || A[2] - B[2] || A[3] - B[3];
          });
          pick = cands[0][3];
          break;
        }
      }
    }
    if (pick === null) {
      var ivs = [3, 4];
      for (var k2 = 0; k2 < ivs.length; k2++) {
        if (poolSet[p - ivs[k2]]) { pick = p - ivs[k2]; break; }
      }
    }
    if (pick === null) {
      var best = null;
      for (var ai = 0; ai < poolArr.length; ai++) {
        var x = poolArr[ai];
        if (best === null) { best = x; continue; }
        var ka = Math.abs(x - (p - 3)), kb = Math.abs(best - (p - 3));
        if (ka < kb || (ka === kb && x < best)) best = x;
      }
      pick = best;
    }
    out.push({ beat: note.beat, dur: note.dur, midi: pick });
  }
  return out;
}

function checkCapability(stage, voices, level) {
  if (voices >= 3) {
    return '三声部需要独立的三部和声写作逻辑（避免外声部平行五度），本版暂只支持 1–2 个声部';
  }
  if (level !== undefined && level !== null) {
    var cap = RULES.MAX_LEVEL_BY_STAGE[stage];
    if (cap !== undefined && level > cap) {
      return RULES.STAGES[stage].label + '最多支持 ' + RULES.LEVELS[cap].label +
             '——再密的节奏（十六分音符、附点）要到中年级才引入';
    }
  }
  return null;
}

function genOnce(stage, goal, level, meter, measures, voices, key, seed) {
  var rng = new Rand(seed);
  var tonicPc = RULES.KEYS[key];
  var beats = RULES.METERS[meter][0];
  var st = RULES.STAGES[stage], lv = RULES.LEVELS[level];
  var nv = Math.max(1, Math.min(3, voices));
  var phraseLen = (measures % lv.phrase_len === 0) ? lv.phrase_len : 2;

  var bad = checkCapability(stage, nv, level);
  if (bad) {
    return { ok: false, report: [bad], unsupported: true, attempts: 0, tier: null };
  }

  var bands = RULES.VOICE_BANDS[nv];
  var topLo = st.lo + bands[0][0], topHi = st.hi - bands[0][1];
  var lowPool = null;
  if (nv >= 2) {
    var lb = bands[1];
    lowPool = {};
    diatonic(st.lo + lb[0], st.hi - lb[1], tonicPc).forEach(function (m) { lowPool[m] = true; });
  }

  var r = genVoice(goal, lv, RULES.METERS[meter], measures, tonicPc, topLo, topHi,
                   rng, '声部1 ', lowPool);
  var notes = r[0], meas = r[1], tier = r[2], attempts = r[3];
  if (notes === null) {
    return { ok: false, attempts: attempts, tier: tier,
             report: ['声部1：重试 ' + attempts + ' 次仍未生成（硬约束互斥）'] };
  }

  var allVoices = [{ idx: 0, lo: topLo, hi: topHi, notes: notes, measures: meas }];
  var finalIdx = notes.length - 1;

  for (var vi = 1; vi < nv; vi++) {
    var vlo = st.lo + bands[vi][0], vhi = st.hi - bands[vi][1];
    var pool = diatonic(vlo, vhi, tonicPc);
    var prevV = allVoices[allVoices.length - 1];
    var low = deriveParallel(prevV.notes, pool, lv.max_interval, tonicPc, finalIdx);
    var lowMeas = [], idx = 0;
    for (var mi = 0; mi < meas.length; mi++) {
      lowMeas.push(low.slice(idx, idx + meas[mi].length));
      idx += meas[mi].length;
    }
    allVoices.push({ idx: vi, lo: vlo, hi: vhi, notes: low, measures: lowMeas });
  }

  var unisonAt = {};
  for (var ui = 0; ui < notes.length; ui++) {
    var allSame = true;
    for (var uv = 0; uv < allVoices.length; uv++) {
      if (allVoices[uv].notes[ui].midi !== notes[ui].midi) { allSame = false; break; }
    }
    if (allSame) unisonAt[ui] = true;
  }

  var report = [];
  allVoices.forEach(function (v) {
    var tag = '声部' + (v.idx + 1) + ' ';
    report = report.concat(vRange(v.notes, v.lo, v.hi, tag));
    report = report.concat(vMeter(v.measures, beats, tag));
    var relaxed = {}; relaxed[finalIdx] = true;
    report = report.concat(vIntervals(v.notes, lv.max_interval, tag, unisonAt, relaxed));
    report = report.concat(vLeapRecovery(v.notes, tag));
    if (v.idx === 0) {
      report = report.concat(vPhraseEndings(v.measures, phraseLen, tonicPc, tag));
    } else {
      var lastNote = v.notes[v.notes.length - 1];
      var dg = degreeOf(lastNote.midi, tonicPc);
      if (dg !== 1 && dg !== 3 && dg !== 5) {
        report.push(tag + '末音落在第 ' + dg + ' 级，应收在主和弦音（1/3/5）');
      }
    }
  });
  for (var a = 0; a < allVoices.length; a++) {
    for (var b = a + 1; b < allVoices.length; b++) {
      var n1 = allVoices[a].notes, n2 = allVoices[b].notes;
      var t2 = '声部' + (a + 1) + '-' + (b + 1) + ' ';
      report = report.concat(vParallel(n1, n2, t2));
      report = report.concat(vCrossing(n1, n2, t2, unisonAt));
      if (b - a === 1) report = report.concat(vSpacing(n1, n2, RULES.MAX_SPACING, t2));
      report = report.concat(vVertical(n1, n2, t2));
    }
  }

  return {
    ok: report.length === 0,
    report: report,
    attempts: attempts,
    tier: tier,
    params: {
      stage: st.label, goal: RULES.GOALS[goal].label, level: lv.label,
      meter: meter, measures: measures, voices: nv, key: key
    },
    tonic_pc: tonicPc,
    voices: allVoices.map(function (v) {
      return { id: 'p' + (v.idx + 1), name: '声部' + (v.idx + 1), measures: v.measures };
    })
  };
}

function genScore(stage, goal, level, meter, measures, voices, key, seed, maxTry) {
  stage = stage || 'mid'; goal = goal || 'melody'; level = level || 1;
  meter = meter || '2/4'; measures = measures || 8; voices = voices || 2;
  key = key || 'C';
  if (maxTry === undefined) maxTry = 12;
  var base = (seed === undefined || seed === null) ? 0 : seed;
  var last = null;
  for (var k = 0; k < Math.max(1, maxTry); k++) {
    var r = genOnce(stage, goal, level, meter, measures, voices, key, base + k * 7919);
    if (r.ok || r.unsupported) { r.seed_retry = k; return r; }
    last = r;
  }
  last.seed_retry = maxTry;
  last.report = ['换 ' + maxTry + ' 个种子仍有瑕疵：'].concat(last.report.slice(0, 5));
  return last;
}

return {
  Rand: Rand, round6: round6, pmod: pmod, RULES: RULES,
  tonicBase: tonicBase, toMidi: toMidi, fromMidi: fromMidi, diatonic: diatonic,
  degreeOf: degreeOf, thirdBelow: thirdBelow, chordTones: chordTones, notate: notate,
  composeMeasure: composeMeasure, buildRhythm: buildRhythm,
  buildPhraseTarget: buildPhraseTarget, planLeaps: planLeaps,
  genVoice: genVoice, deriveParallel: deriveParallel,
  checkCapability: checkCapability, genOnce: genOnce, genScore: genScore,
  vRange: vRange, vMeter: vMeter, vIntervals: vIntervals, vLeapRecovery: vLeapRecovery,
  vStepRatio: vStepRatio, vRepeatRatio: vRepeatRatio, vLeapCount: vLeapCount,
  vArch: vArch, vPhraseEndings: vPhraseEndings, vParallel: vParallel,
  vCrossing: vCrossing, vSpacing: vSpacing, vVertical: vVertical
};
});
</script>
<script>
/* ================= 采样与音频 =================
   采样表由构建时从 samples/manifest.json 注入（见 piano.py），不在这里写死。 */
const SAMPLE_MIDI = {
  A3: 57, Bb3: 58, B3: 59, C4: 60, Db4: 61, D4: 62,
  Eb4: 63, E4: 64, F4: 65, Gb4: 66, G4: 67, Ab4: 68,
  A4: 69, Bb4: 70, B4: 71, C5: 72, Db5: 73, D5: 74,
  Eb5: 75, E5: 76,
};
const SAMPLE_KEYS = Object.keys(SAMPLE_MIDI);
const NGAIN = {
  A3: 5.858, Bb3: 5.858, B3: 5.161, C4: 5.161, Db4: 5.467, D4: 5.044,
  Eb4: 5.221, E4: 5.044, F4: 5.044, Gb4: 5.044, G4: 5.102, Ab4: 5.161,
  A4: 5.343, Bb4: 5.343, B4: 5.102, C5: 4.929, Db5: 5.161, D5: 5.221,
  Eb5: 5.221, E5: 5.282,
};
const MAJOR = [0,2,4,5,7,9,11];

const A = {ctx:null, buffers:{}};

function b64ToBuffer(b64){
  const bin = atob(b64), n = bin.length, bytes = new Uint8Array(n);
  for(let i=0;i<n;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}
function decodeOne(b64){
  const buf = b64ToBuffer(b64);
  return new Promise((res, rej)=>{
    const p = A.ctx.decodeAudioData(buf, res, rej);
    if(p && typeof p.then === 'function') p.then(res, rej);
  });
}
async function initAudio(){
  if(A.ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  A.ctx = new AC();
  A.master = A.ctx.createGain();
  A.master.gain.value = 1.0;
  A.master.connect(A.ctx.destination);
  await Promise.all(SAMPLE_KEYS.map(async k=>{ A.buffers[k] = await decodeOne(PIANO[k]); }));
}
function nearest(midi){
  let best = SAMPLE_KEYS[0], bd = 1e9;
  for(const k of SAMPLE_KEYS){
    const d = Math.abs(SAMPLE_MIDI[k] - midi);
    if(d < bd){ bd = d; best = k; }
  }
  return best;
}

/* ================= 简谱渲染 =================
   每个音符固定三段：上点区 / 数字区 / 下点区。
   下划线画在数字正下方（border-bottom），不用绝对定位——
   绝对定位一旦外层宽度不确定就会飘到别的音符底下。 */
function noteHTML(midi, dur, base){
  const rel = midi - base;
  const oct = Math.floor(rel/12);
  const off = ((rel % 12) + 12) % 12;
  const di = MAJOR.indexOf(off);
  const deg = di < 0 ? '?' : (di + 1);
  let cls = '';
  if(dur < 1 && dur >= 0.5) cls = ' l1';
  else if(dur < 0.5) cls = ' l2';
  /* 高/低八度点画成圆点，不用 '·' 字符。
     用字符的时候字号 10px，那个点只有一两个像素，看上去就是"没有点"——
     结果页画的是 4.5px 的实心圆，一眼能看见。两边现在同一种画法。 */
  let marks = '';
  if(oct > 0) marks += '<i class="oct"></i>';
  if(oct < 0) marks += '<i class="oct low"></i>';
  let body = '<span class="dg' + cls + '">' + deg + marks + '</span>';
  if(dur >= 2) body += '<span class="dash">' + '－'.repeat(Math.round(dur) - 1) + '</span>';
  if(dur === 0.75 || dur === 1.5) body += '<span class="dot">·</span>';
  /* flex-grow = 时值：这一格在小节里占的宽度，结果页用同一套规则（见 .m > *） */
  return '<span class="n' + cls + '" style="flex-grow:' + dur + '">' +
         '<span class="top"></span>' +
         '<span class="mid">' + body + '</span>' +
         '<span class="bot"></span>' +
         '</span>';
}
function voiceHTML(v, sc){
  return v.measures.map(function(m){
    let out = '', i = 0, pos = 0;        // pos = 当前音在小节里的起点（拍），用于按拍分组横梁
    while(i < m.length){
      if(m[i][1] < 1){
        /* 连续短音符（八分/十六分/附点八分）包成一组：
           下划线画在 .n 的整个盒子上（含左右 padding），组内 gap:0，
           相邻两条线就接上了，看起来是一条横梁。
           以前下划线画在数字盒上、音符之间又有 5px padding，
           于是相邻八分下面成了两截短线，中间空 10px。

           **但横梁不跨整拍**：我们的拍号拍单位都是四分音符，所以判据是"下一个音的起点
           是不是落在整拍上"——是就断成一条新横梁。于是 4 个八分（= 2 拍）画成
           前 2 个一条 + 后 2 个一条（一眼看出拍子结构）；4 个十六分（= 1 拍）
           仍是一条横梁，只是配两条线。（用户 2026-09-29 指出） */
        let g = '', sum = 0, fits = true;
        const beamFrom = pos;            // 这组的起点（拍）
        while(i < m.length && m[i][1] < 1 && fits){
          /* ⚠ 收之前判，不能收完再判——收完再判会把多出来的那个音留在组里：
             实测 [0.5,0.5,0.5] 会变成"三个音一组、横跨 0→1.5 拍"。
             组内第一个音无条件收（sum === 0）。 */
          fits = sum === 0 ||
                 Math.floor(beamFrom + 1e-9) === Math.floor(pos + m[i][1] - 1e-9);
          if(!fits) break;
          sum += m[i][1]; g += noteHTML(m[i][0], m[i][1], sc.base);
          pos += m[i][1]; i++;
        }
        out += '<span class="bm" style="flex-grow:' + sum + '">' + g + '</span>';
      } else {
        out += noteHTML(m[i][0], m[i][1], sc.base);
        pos += m[i][1]; i++;
      }
    }
    return '<span class="m">' + out + '</span>';
  }).join('');
}
function scoreHTML(sc){
  return sc.voices.map(function(v, i){
    return '<div class="row">' +
      '<div class="vname p' + (i + 1) + '">' + v.name + '</div>' +
      '<div class="staff">' + voiceHTML(v, sc) + '</div>' +
      '</div>';
  }).join('');
}
function hl(beat, per){
  const mi = Math.floor(beat/per + 1e-9);
  document.querySelectorAll('.staff').forEach(function(st){
    st.querySelectorAll('.m').forEach(function(m, i){
      m.classList.toggle('cur', i === mi);
    });
  });
}

/* ================= 播放器 =================
   支持播放 / 暂停 / 继续 / 停止 / 选声部 / 变速。
   暂停记的是"第几拍"，继续时从那一拍接上（和已有播放器同一套时间模型）。 */
function makePlayer(opts){
  opts = opts || {};
  const P = {playing:false, beat:0, base:0, total:0, nodes:[], raf:null, t0:0,
             score:null, sel:[], spb:0.75};
  function clearNodes(){ P.nodes.forEach(function(n){ try{ n.stop(); }catch(e){} }); P.nodes = []; }
  function stopRaf(){ if(P.raf){ cancelAnimationFrame(P.raf); P.raf = null; } }
  function halt(){ clearNodes(); stopRaf(); P.playing = false; }
  function now(){
    if(!P.playing) return P.beat;
    return Math.min(P.total, Math.max(0, P.base + (A.ctx.currentTime - P.t0)/P.spb));
  }
  function emit(){ if(opts.onTick) opts.onTick(P.beat, P.score ? P.score.beatsPerMeasure : 4); }
  function tick(){
    P.beat = now();
    if(P.beat >= P.total - 1e-6){
      halt(); P.beat = 0; P.base = 0; emit();
      if(opts.onEnd) opts.onEnd();
      return;
    }
    emit();
    P.raf = requestAnimationFrame(tick);
  }
  async function play(score, sel, bpm){
    if(P.playing){ P.beat = now(); P.base = P.beat; }
    P.score = score;
    P.total = score.totalBeats;
    if(Array.isArray(sel)) P.sel = sel;
    P.spb = 60 / (bpm || 80);
    await initAudio();
    if(A.ctx.state === 'suspended') await A.ctx.resume();
    clearNodes(); stopRaf();
    if(P.beat >= P.total - 1e-6){ P.beat = 0; P.base = 0; }
    const from = P.base;
    const lead = 0.12;
    P.t0 = A.ctx.currentTime + lead;
    score.voices.forEach(function(v, vi){
      if(!P.sel[vi]) return;
      const g = A.ctx.createGain();
      g.gain.value = vi === 0 ? 0.9 : 0.62;   // 低声部压一点，别盖住旋律
      g.connect(A.master);
      let b = 0;
      v.measures.forEach(function(m){
        m.forEach(function(p){
          const midi = p[0], dur = p[1];
          const rel0 = b - from;
          b += dur;
          if(rel0 + dur <= 0) return;             // 继续播放时跳过已过去的音
          const s = Math.max(0, rel0);
          const d = dur - Math.max(0, -rel0);     // 正在响的那个音按剩余时长补上
          if(d <= 0.01) return;
          const name = nearest(midi);
          const src = A.ctx.createBufferSource();
          src.buffer = A.buffers[name];
          src.playbackRate.value = Math.pow(2, (midi - SAMPLE_MIDI[name])/12);
          const env = A.ctx.createGain();
          src.connect(env); env.connect(g);
          const at = P.t0 + s*P.spb;
          const len = d*P.spb;
          src.start(at);
          /* 增益分两段写清楚：起音就设到归一化后的值，到尾端才降到 0.9 倍再淡出。
             原来只写了「at+0.75len 时设 0.9」——那之前 gain 一直是 createGain 的默认 1.0，
             等于整条音里音头那段根本没被设过，而且归一化增益一直没接上：
             源采样峰值只有 −20.8 dBFS，不补这一层，产品页会比导出的离线页安静近 14 dB。
             同一个文件两种响度，老师在电脑上试听觉得"够"，到教室里放就不是一回事了。 */
          const amp = NGAIN[name] || 1;
          env.gain.setValueAtTime(amp, at);
          env.gain.setValueAtTime(amp*0.9, at + Math.max(0.05, len*0.75));
          env.gain.linearRampToValueAtTime(0.0001, at + len + 0.18);
          try{ src.stop(at + len + 0.3); }catch(e){}
          P.nodes.push(src);
        });
      });
    });
    P.playing = true;
    P.raf = requestAnimationFrame(tick);
  }
  function pause(){
    if(!P.playing) return;
    P.beat = now(); P.base = P.beat;
    halt(); emit();
  }
  function stop(){
    halt(); P.beat = 0; P.base = 0; emit();
  }
  return {play:play, pause:pause, stop:stop, isPlaying:function(){ return P.playing; },
          nodes:function(){ return P.nodes.length; }};
}

/* ================= 播放条装配 =================
   每次重建 DOM 再挂事件。不重建的话，换一条练习曲就多挂一份监听，
   点一下会连着播好几遍——这类 bug 排查起来很费时间。 */
function setupTransport(sc, bpm0, withExport, onExport){
  const box = document.getElementById('transport');
  box.innerHTML =
    '<button id="btnPlay" class="tp primary">▶ 播放</button>' +
    '<button id="btnStop" class="tp">⏹ 停止</button>' +
    '<span class="sep"></span>' +
    '<span class="tog" id="voicetoggles"></span>' +
    '<span class="grow"></span>' +
    '<span class="spd">速度 <b id="bpmv"></b> BPM</span>' +
    '<input id="bpm" class="rng" type="range" min="40" max="132" step="2">' +
    (withExport ? '<button id="btnExport" class="tp">导出离线包</button>' : '');
  box.classList.add('ready');

  const bpmEl = document.getElementById('bpm');
  const bpmvEl = document.getElementById('bpmv');
  bpmEl.value = bpm0 || sc.bpm || 80;
  bpmvEl.textContent = bpmEl.value;

  const sel = sc.voices.map(function(){ return true; });
  const player = makePlayer({
    onTick: function(b, per){ hl(b, per); },
    onEnd: function(){ setPlay(false); }
  });
  function setPlay(on){ document.getElementById('btnPlay').textContent = on ? '⏸ 暂停' : '▶ 播放'; }
  function curBpm(){ return +bpmEl.value; }
  function drawToggles(){
    document.getElementById('voicetoggles').innerHTML = sc.voices.map(function(v, i){
      return '<button class="pill v' + (i+1) + (sel[i] ? ' on' : '') +
             '" data-i="' + i + '">' + v.name + '</button>';
    }).join('');
  }
  document.getElementById('voicetoggles').addEventListener('click', function(e){
    const b = e.target.closest('.pill');
    if(!b) return;
    const i = +b.dataset.i;
    sel[i] = !sel[i];
    if(!sel.some(Boolean)) sel[i] = true;         // 至少留一个声部，否则播出来是静音
    drawToggles();
    if(player.isPlaying()) player.play(sc, sel, curBpm());
  });
  document.getElementById('btnPlay').addEventListener('click', function(){
    if(player.isPlaying()){ player.pause(); setPlay(false); }
    else { player.play(sc, sel, curBpm()); setPlay(true); }
  });
  document.getElementById('btnStop').addEventListener('click', function(){
    player.stop(); setPlay(false);
  });
  bpmEl.addEventListener('input', function(){
    bpmvEl.textContent = bpmEl.value;
    if(player.isPlaying()) player.play(sc, sel, curBpm());
  });
  if(withExport && onExport){
    document.getElementById('btnExport').addEventListener('click', onExport);
  }
  drawToggles();
  setPlay(false);
  hl(0, sc.beatsPerMeasure);
  window.PLAYER = player;      // 留一个句柄，验证脚本和调试都要用
  return player;
}
